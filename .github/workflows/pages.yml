name: Deploy to GitHub Pages

# Builds the add-in and publishes the dist/ web files to GitHub Pages.
# The published site root serves taskpane.html, assets/, etc. — i.e. the add-in's
# hosted web files. Your add-in URL is https://<user>.github.io/<repo>/
#
# WHY THE GATE JOB EXISTS
# This workflow used to run `npm ci && npm run build` and publish, with no tests.
# CI ran in a SEPARATE workflow, concurrently, and nothing consumed its result —
# so a commit failing `npm test`, the compound-dictionary check or manifest
# validation still reached production, because webpack only fails on type errors.
# Pages serves the installable /manifest.xml and version.json (the user update
# trigger), so "the site" and "the shipped add-in" are the same artefact.
#
# `deploy` now needs `gate`. A red gate publishes nothing.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Validate compound dictionary
        run: npm run validate:compounds
      - name: Validate manifest
        run: npx office-addin-manifest validate manifest.xml
      # NEEDS NO BROWSER AND NO NETWORK, so it belongs on the publish path.
      # check-tool-pages.js is the gate that was written BECAUSE a tool page
      # shipped broken for ten releases — and it was guarding nothing here.
      - name: Tool pages
        run: npm run check:toolpages
      # Same: a pure-Node figure-geometry audit. It caught the class of defect
      # where a legend outside the plot frame gets clipped or overlapped.
      # Its corpus coverage is derived from src/lib, so a new chart module with
      # no figure in the corpus fails here rather than shipping ungated.
      - name: Figure layout
        run: npm run check:figures
      # And the third: every getElementById in the pane must have a matching id.
      # A miss is a null at runtime and a control that silently does nothing,
      # which no type check and no unit test can see. This was inline PowerShell
      # in scripts/qc.ps1, so it ran only on a Windows machine and never on the
      # publish path. It is plain Node and needs neither browser nor network.
      - name: Task-pane id wiring
        run: npm run check:idwiring
      # The headless RENDER and landing-layout checks are still deliberately NOT
      # run here: both need a Chromium-family browser and both SKIP without one.
      # Adding them to a runner with no browser would add green ticks that
      # checked nothing — the exact failure this block exists to prevent. They
      # run in `npm run qc` locally, where a browser exists. The two checks
      # above are different: they are plain Node and fail honestly.

  deploy:
    name: Build and publish
    needs: gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
