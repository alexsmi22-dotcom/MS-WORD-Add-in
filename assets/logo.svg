<!--
  The JurisLab mark: a balance weighing science against mathematics — a benzene
  ring on one pan, a summation sign on the other.

  This is the SAME drawing as the brand mark in landing/index.html, scaled to a
  128 viewBox and inset to 88% so it sits inside an app-icon corner radius. The
  two had drifted apart: this file carried a trapezoid plinth, pan hangers and an
  all-white ring, while the site had moved to a flat base and a CYAN ring. The
  site was right, so this followed it rather than the other way round.

  The plate is the site's own hero navy rather than the old bright sky gradient,
  because the cyan ring is the point of the mark and it disappears against
  #0EA5E9. A ribbon icon that cannot show its own accent colour is not the mark.
-->
<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="JurisLab: scales of justice weighing science against mathematics">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0C4A6E"/>
      <stop offset="0.55" stop-color="#0A3A57"/>
      <stop offset="1" stop-color="#062231"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="122" height="122" rx="27" fill="url(#g)"/>
  <g fill="#fff">
    <circle cx="64" cy="27.86" r="7.04"/>
    <rect x="59.78" y="27.86" width="8.45" height="65.71" rx="3.28"/>
    <rect x="19.89" y="36.78" width="88.24" height="8.91" rx="4.46"/>
    <rect x="43.35" y="93.57" width="41.30" height="8.91" rx="3.76"/>
  </g>
  <g fill="none" stroke-width="6.34" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="53.20,66.82 45.70,79.81 30.71,79.81 23.17,66.82 30.71,53.83 45.70,53.83" stroke="#38BDF8"/>
    <polyline points="102.48,54.61 77.61,54.61 89.73,66.82 77.61,79.02 102.48,79.02" stroke="#fff"/>
  </g>
</svg>
