  <style>
    :root { --blue:#2e74b5; --ink:#1b1b1f; --muted:#5b5b66; --bg:#f6f8fb; --card:#fff; --line:#e4e8ef; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); line-height:1.6; }
    .wrap { max-width:820px; margin:0 auto; padding:0 20px; }
    header { background:linear-gradient(135deg,#2e74b5,#1f4e79); color:#fff; padding:40px 0 34px; }
    .back { display:inline-block; color:#fff; text-decoration:none; opacity:.9; font-size:.95rem; margin-bottom:18px; }
    .back:hover { opacity:1; text-decoration:underline; }
    h1 { font-size:2.1rem; margin:0 0 8px; }
    .tagline { font-size:1.12rem; opacity:.95; margin:0; max-width:660px; }
    section { padding:30px 0; }
    h2 { color:var(--blue); font-size:1.25rem; margin:0 0 14px; }
    ul.does { list-style:none; margin:0; padding:0; }
    ul.does li { background:var(--card); border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:8px; padding:11px 15px; margin-bottom:9px; }
    ul.does li b { color:var(--ink); }
    .examples { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 18px 14px; }
    .ex { padding:12px 0; border-bottom:1px dashed var(--line); }
    .ex:last-child { border-bottom:none; }
    .ex .io { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.92rem; }
    .ex .io .in { background:#eef1f6; padding:2px 7px; border-radius:5px; }
    .ex .io .arrow { color:var(--muted); margin:0 8px; }
    .ex .io .out { background:#e7f7ec; padding:2px 7px; border-radius:5px; }
    .ex .note { color:var(--muted); font-size:.95rem; margin-top:5px; }
    .note-box { background:#eef4fb; border:1px solid #d6e3f3; border-radius:10px; padding:14px 16px; color:#234; font-size:.95rem; }
    .nav { display:flex; justify-content:space-between; gap:12px; padding:10px 0 40px; }
    .nav a { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 16px; text-decoration:none; color:var(--blue); font-weight:600; flex:1; }
    .nav a:hover { border-color:var(--blue); }
    .nav a.next { text-align:right; }
    .nav a small { display:block; color:var(--muted); font-weight:400; font-size:.8rem; }
    footer { text-align:center; color:var(--muted); font-size:.9rem; padding:24px 0 44px; }
    a { color:var(--blue); }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .missing { padding:60px 0; text-align:center; }

  <script>
  // Each tool: icon, title, tagline, does[] (HTML bullets), examples[] ({in,out} or {note}).
  const TOOLS = {
    engineering: { title:"Engineering", tagline:"Fifty-eight calculators across thirteen disciplines &mdash; structural and solids, fatigue and machine design, fluids, thermal, electronics, chips and semiconductors, aviation and avionics, control systems, vibration, optics and photonics, quantum optics, biomedical and pharmacokinetics &mdash; grouped as panels rather than buried in one dropdown, and computed exactly where exact is possible. The answers that are genuinely rational are reported as fractions rather than rounded.",
      does:[
        "<b>Structural &amp; solids (6)</b> &mdash; <b>beams</b>: reactions, shear force and bending moment diagrams, slope and deflection, from point, uniform and linearly varying loads and applied couples, with indeterminate spans on the same code path. Supports may be <b>rigid, elastic or settling</b> (<code>roller 8 k=5e4</code>, <code>roller 8 settle=0.01</code>) and the solve stays exact; those two cases need EI and say why, because a spring or a settlement makes the reactions genuinely depend on the beam's own stiffness. On a <i>determinate</i> beam neither changes any reaction &mdash; the beam simply moves &mdash; and the tool reports that rather than leaving you to wonder. Every number may be an exact <b>fraction</b> (<code>roller 8/3</code>, <code>point 30 at 8/3</code>), which matters when the engine computes over rationals and 2.6666666667 does not. <b>Cross-sections</b>: area, I, section modulus, radius of gyration and Q for rectangle, circle, pipe, box, I-beam and tee &mdash; and <i>both</i> section moduli when the section is not symmetric, because the fibre that yields first is the far one. <b>Stress states</b>: principal stresses, Mohr's circle, von Mises, Tresca and factor of safety, reporting the absolute maximum shear as well as the in-plane one. <b>Trusses</b> by the method of joints, solved exactly. <b>Column buckling</b> with the Johnson parabola. <b>Shaft torsion</b>, circular sections only.",
        "<b>Fatigue &amp; machine design (3)</b> &mdash; corrected endurance limit by the <b>Marin factors</b>, notch factor, <b>all four mean-stress criteria shown together</b> rather than one picked for you, finite life and Miner cumulative damage over a load spectrum. The <b>Langer yield check runs alongside every criterion</b>, because Goodman alone can pass a part that yields on its first cycle. The endurance limit <b>does not exist for non-ferrous alloys</b> and it says so instead of returning a false infinite life.",
        "<b>Fluids (4)</b> &mdash; <b>pipe flow</b> with Colebrook-White <i>solved</i> rather than approximated, and the regime stated honestly. <b>Open-channel flow</b> by Manning with the Froude regime and a hydraulic-jump warning. <b>Pump NPSH</b> and cavitation margin. <b>Compressible flow</b> with the choking condition.",
        "<b>Thermal (5)</b> &mdash; <b>composite walls and pipe insulation</b> as a resistance chain with every interface temperature, the controlling layer, and the <b>critical radius</b> below which adding insulation makes the heat loss worse. <b>Heat exchangers</b> by LMTD, counter or parallel flow. <b>Ideal-gas processes</b> (all five as one polytropic family). <b>Power cycles</b> &mdash; Otto, Diesel and Brayton, each checked against the Carnot bound between its own extremes. <b>Rankine and refrigeration</b>, which take enthalpies from your own tables: no steam tables are built in, deliberately, because a table reconstructed from memory would be unverifiable.",
        "<b>Electronics (5)</b> &mdash; <b>DC operating point</b> by modified nodal analysis, exact over rationals, accepting values written the way a schematic prints them (2k2, 4R7). <b>AC response</b> as phasors at a frequency or a swept <b>Bode plot</b>. <b>Op-amp circuits</b> with the real limits the ideal model hides &mdash; gain-bandwidth, slew rate, the integrator that saturates without DC feedback. <b>Analogue filter design</b> (Butterworth and Chebyshev) that computes the minimum order from a specification and hands the result to the control tools as a transfer function. <b>Truth tables with Quine-McCluskey minimisation</b>, which does not run out at five variables the way a Karnaugh map does.",
        "<b>Control systems (4)</b> &mdash; transfer functions with the <b>exact Routh-Hurwitz array</b>, and <b>stability decided twice</b>: exactly by Routh and numerically from the poles. When the two disagree it reports both and chooses neither, because that means a pole is too close to the axis to trust. <b>Step and impulse response</b> with damping ratio, overshoot and settling time. <b>Frequency response with gain and phase margins</b>, where a margin that does not exist is reported as not existing. <b>PID with the loop closed</b>. A right-half-plane zero is named as non-minimum-phase.",
        "<b>Vibration (4)</b> &mdash; free response with logarithmic decrement, forced response and isolation, and multi-degree-of-freedom natural frequencies and mode shapes via a symmetric generalised eigenproblem, so the frequencies are guaranteed real. <b>Multi-DOF forced response</b> by modal superposition gives amplitude and phase at every degree of freedom plus the modal breakdown, so you can see which mode is carrying the load: <b>every</b> natural frequency is a resonance, not just the first, and a force applied at a <b>node</b> of a mode cannot excite it at all. Damping is entered as modal ratios or a Rayleigh pair, because the method assumes <b>classical damping</b> &mdash; which a single discrete damper between two floors does not satisfy &mdash; and it states that rather than assuming it of a matrix you supplied. Built around the three results most often got wrong: <b>resonance is not at r = 1</b>, <b>isolation only begins above r = &radic;2</b> (below it a mount amplifies), and <b>damping helps below &radic;2 and hurts above it</b>.",
        "<b>Chips &amp; semiconductors (4)</b> &mdash; <b>switching and leakage power</b> (P = &alpha;CV&sup2;f, with the activity factor defined as 0&rarr;1 transitions per CYCLE, because the other convention in circulation halves the formula and doubles alpha), <b>junction temperature</b> through the series thermal path with every interface temperature and the power that would reach the limit, <b>interconnect RC delay</b> reporting the Elmore upper bound and the 50% crossing SEPARATELY (0.5&middot;RC against 0.38&middot;RC &mdash; Elmore is about 30% pessimistic and quoting one as the other is a silent error in a timing budget), and <b>setup/hold closure</b>, where clock skew enters the two checks with OPPOSITE signs. Leakage is a measured input rather than a prediction: it is exponential in temperature and specific to the process.",
        "<b>Aviation &amp; avionics (5)</b> &mdash; the <b>ICAO/US-1976 standard atmosphere</b> walked layer by layer to 84.852 km, because the barometric relation is a power law where the lapse rate is non-zero and an exponential where it is zero, and one formula applied across a boundary is a plausible wrong number; the <b>airspeed chain</b> TAS/EAS/CAS/Mach, where CAS is derived through the IMPACT PRESSURE rather than from EAS by a density correction (the compressibility term does not cancel); the <b>drag polar</b> with best L/D derived from the polar rather than searched, so the two cannot disagree; <b>level-turn</b> load factor and radius, where stall speed rises with &radic;n and not with n &mdash; 60&deg; of bank is 2 g and a 41% higher stall, not 100%; and <b>climb and glide</b> from the exact arcsine of (T&minus;D)/W rather than the small-angle shortcut. The base pressures of the atmosphere are GENERATED from the recurrence rather than typed, so the profile is continuous by construction. <b>IAS is not computed</b>: CAS&rarr;IAS is instrument and position error, a property of the airframe.",
        "<b>Optics &amp; photonics (8)</b> &mdash; <b>Gaussian beams</b> (Rayleigh range, divergence, M&sup2;, waist propagation), <b>ABCD ray matrices</b> for a whole system with the beam traced through it, <b>two-mirror cavity stability</b> and mode size, <b>pulse energy, peak power and fluence</b>, refraction with total internal reflection and Brewster, the <b>Airy disc and grating orders</b>, and <b>step-index fibre</b> NA, V-number and cutoff. The factor-of-two traps are named in every result: w is a 1/e&sup2; RADIUS, divergence is a HALF-angle, peak fluence is twice the energy over the 1/e&sup2; area, and a Gaussian pulse peaks at 0.939 E/&tau; rather than E/&tau;. There is deliberately <b>no refractive-index table</b> &mdash; n is dispersive and a table recalled rather than cited would be unverifiable, so you supply it.",
        "<b>Quantum optics (4)</b> &mdash; entanglement of a <b>two-qubit state</b> (concurrence, entanglement entropy, Schmidt spectrum) where the PHASE decides the answer, a <b>CHSH Bell test</b> that checks the classical bound of 2 and also Tsirelson&rsquo;s 2&radic;2 &mdash; a value above the latter is flagged as an error rather than a stronger result &mdash; the <b>Werner state</b>, which is entangled above p = 1/3 but cannot violate CHSH until p = 0.707, and the <b>BB84 secure key rate</b>, whose famous 11% threshold is computed as the root of the rate formula rather than typed in beside it.",
        "<b>Biomedical (3)</b> &mdash; <b>haemodynamics</b> (Poiseuille flow, wall shear stress, systemic vascular resistance), where the fourth-power dependence on radius means a 20% narrowing more than doubles the resistance. <b>Joint biomechanics</b> including the <b>joint reaction force</b> that is usually left out, and which is larger than either the muscle force or the load. <b>Signal sampling and aliasing</b>, because aliasing is the one failure here that cannot be undone afterwards.",
        "<b>Pharmacokinetics (3)</b> &mdash; IV bolus, infusion and oral <b>dose and concentration curves</b>, built on clearance and volume because those are the physiologically independent parameters and half-life is a consequence of both. <b>Steady state</b> with accumulation and loading dose, where the average depends only on dose rate and clearance while the time to get there depends only on half-life. <b>Non-compartmental analysis</b> of measured data, with the terminal window chosen by best adjusted R&sup2; and the <b>% of AUC from extrapolation</b> reported. <b>Flip-flop kinetics are detected</b> &mdash; if absorption is slower than elimination the terminal slope is absorption, not elimination, and the curve looks normal either way.",
        "<b>Exact where exact is possible.</b> Beams, trusses and DC circuits compute over rationals rather than floats, so a propped cantilever reports 3/8 wL and not 0.37499999996, a zero-force member is an exact zero rather than something under a tolerance, and a divider reports 10/3 V rather than 3.3333. <b>Statically indeterminate beams are the same code path</b> &mdash; compatibility is solved alongside equilibrium, with no force method and no superposition table.",
        "<b>Units are converted, and the conversion is reported.</b> A bare number is read in the unit the field names and flagged as assumed; write another unit (200 GPa, 1e6 mm^4, 50 ksi, 68 &deg;F) and it is converted <i>and told to you</i>; a unit of the wrong quantity is refused by name rather than silently dropped. This closed a live trap: cross-sections report I in mm&#8308; because that is what section tables print, buckling wants m&#8308;, and pasting one into the other was wrong by 10&#185;&sup2; while looking entirely plausible.",
        "<b>It refuses in the vocabulary of the subject, not the matrix.</b> A node with no DC path to ground is named as that, because it is the commonest netlist mistake. A mechanism, an indeterminate truss and a <b>critical form</b> &mdash; where the member count balances and the structure still collapses &mdash; are each named, which matters because counting members is exactly what cannot catch the third.",
      ],
      examples:[
        {in:"Beam: span 8, pin 0 / roller 8, udl 5 from 0 to 8", out:"R = 20 kN each &#183; M<sub>max</sub> = 40 kN&#183;m at mid-span"},
        {in:"Propped cantilever under a uniform load w", out:"R = 3/8 wL &mdash; <em>exact, not 0.37499999996</em>"},
        {in:"Stress state: &sigma;<sub>1</sub> = 100, &sigma;<sub>2</sub> = 60", out:"20 MPa in-plane max shear, <em>50 in truth</em>"},
        {note:"That second number is the one the bar yields at. For a biaxial state the zero out-of-plane principal stress lies outside the in-plane pair, so the in-plane circle understates the shear the material actually sees &mdash; which is why the absolute maximum is reported alongside it and the difference is called out."},
        {in:"DC divider, 2k2 and 4R7 written as a schematic prints them", out:"10/3 V &mdash; <em>exact over rationals</em>"},
        {in:"Pipe flow at Re 3200", out:"a number, <em>and a statement that it is not repeatable</em>"},
        {note:"The transition band from Re 2300 to 4000 has no trustworthy correlation, so saying so is the honest answer. Laminar flow uses 64/Re and reports that roughness was ignored, because a laminar flow cannot feel the wall. Colebrook-White is solved rather than approximated."},
        {in:"Pipe insulation below the critical radius k/h", out:"adding insulation <em>increases</em> the heat loss"},
        {in:"Fatigue: finite life from an S-N line", out:"a life reported as an order of magnitude"},
        {note:"Sut and Sy are asked for rather than looked up from an alloy designation, because they move by a factor of three with heat treatment. Identical specimens differ by a factor of three too, so a fatigue life quoted to three significant figures is the most confidently wrong number in mechanical engineering, and this says so with the answer."},
        {in:"Control: gain and phase margins of an open-loop L(s)", out:"a margin that does not exist is <em>reported as not existing</em>"},
        {note:"Stability is decided twice over &mdash; exactly by the Routh-Hurwitz array and numerically from the poles. When the two disagree the result says so and picks neither, because a disagreement means a pole sits too close to the imaginary axis for the numerical answer to be trusted. A right-half-plane zero is named as non-minimum-phase rather than left for you to notice."},
        {in:"Vibration: mount an instrument at a frequency ratio of 1.2", out:"the mount <em>amplifies</em> &mdash; isolation begins above &radic;2"},
        {note:"Three results in forced vibration are more often got wrong than right, so they are computed rather than assumed: resonance is not at r = 1 for a damped system, isolation only begins above r = &radic;2, and damping helps below &radic;2 while it hurts above it."},
        {in:"Thermal: a claimed efficiency, with temperatures typed in &deg;C", out:"converted to kelvin first, and the Carnot bound checked"},
        {note:"Every efficiency here is a ratio of ABSOLUTE temperatures, so a Celsius value used as kelvin does not give a slightly wrong answer &mdash; it turns a 62% bound into 96%. Rankine and refrigeration deliberately take enthalpies from your own tables rather than shipping steam tables, because a table reconstructed from memory would be unverifiable."},
        {in:"Logic: minimise a six-variable Boolean expression", out:"Quine-McCluskey &mdash; <em>a Karnaugh map runs out at five</em>"},
        {in:"PK: oral dose where absorption is slower than elimination", out:"flip-flop kinetics <em>detected and named</em>"},
        {note:"The terminal slope there is absorption, not elimination, and the concentration curve looks entirely normal either way &mdash; which is why it is called out rather than left in the number. Non-compartmental analysis also reports what percentage of the AUC came from extrapolation, because above about 20% the study simply did not follow the drug long enough."},
        {note:"<b>Honest limits.</b> Beams are Euler-Bernoulli (prismatic, linearly elastic, small-deflection, no shear deformation). Supports may be rigid, elastic or settling; the elastic and settling cases need EI and their reactions genuinely depend on it, which the tool checks by re-solving at a different EI rather than asserting. Trusses are pin-jointed, planar and determinate only &mdash; an indeterminate one is refused rather than guessed. Torsion covers circular shafts only, because Tr/J is a theorem for a circle and plainly false for a rectangle. Buckling uses the Johnson parabola rather than Euler alone, and is still the critical load of a <i>perfect</i> column. Circuits are linear and lumped: no diodes or transistors, no transient analysis, no mutual inductance or transmission lines. Control is linear, time-invariant and single-input single-output. Free vibration is single-degree-of-freedom; forced response is available for both single- and multi-degree-of-freedom systems, the multi-DOF case by modal superposition, which assumes classical (proportional) damping &mdash; a single discrete damper between two floors does not satisfy that and needs complex modes this does not do. Pharmacokinetics reports what fraction of the AUC was extrapolated, because above about 20% the study did not follow the drug long enough. There is no design code anywhere in this tool: it computes the mechanics, it does not tell you whether a member passes."},
      ] },
    analyze: { title:"Analyze", tagline:"A no-code numerical workbench inside Word — matrix math, optimization, signal processing, differential equations, and data insights, all computed offline from your own numbers.",
      does:[
        "<b>Linear algebra</b> — solve A·x = b, matrix inverse, determinant, rank &amp; trace, transpose, and multiplication, with partial pivoting for stability. Singular systems are reported honestly, never faked.",
        "<b>Eigenvalues</b> — for symmetric matrices (real values + eigenvectors) or <em>any</em> square matrix via the Francis double-shift QR algorithm, including complex-conjugate pairs shown as a ± bi.",
        "<b>QR and SVD</b> decompositions (Householder QR; one-sided Jacobi SVD, any shape).",
        "<b>Matrix expressions</b> — define named matrices and evaluate one line, e.g. A*inv(B) + 2*C', det(A), (A−B)^T.",
        "<b>Optimization</b> — minimize an objective you type (Nelder–Mead simplex); reports the optimum, minimum value, and convergence.",
        "<b>FFT / spectrum</b> — a sampled signal → amplitude spectrum, dominant frequencies, and a chart.",
        "<b>ODE / system solving</b> — y' = f(t, y) and coupled systems via an adaptive Dormand–Prince RK45 solver → a sampled table and a trajectory plot.",
        "<b>Boundary value problems</b> — y&Prime; = f(x, y, y&prime;) with y fixed at <i>both</i> ends, by finite differences or shooting. The honest part is what cannot be computed: an initial value problem has one solution, a <b>BVP may have none, one, or infinitely many</b> &mdash; y&Prime; + y = 0 on [0, &pi;] with both ends zero has infinitely many, and moving one endpoint to 1 leaves it with none. Both look like ordinary inputs, so every result says it reports ONE solution and cannot tell you which case you are in. It also solves on three grids and reports the <b>observed convergence order</b> as a self-check.",
        "<b>PDEs &mdash; heat, wave and Laplace/Poisson</b> by finite differences. <b>Stability is enforced, not hoped for:</b> explicit heat stepping is stable only for r = &alpha;&Delta;t/&Delta;x&sup2; &le; 1/2, and at r = 0.51 it does not degrade gently &mdash; it blows up to 1e300 within a few dozen steps from input that looks entirely reasonable. &Delta;t is reduced to satisfy the bound and the result <i>says</i> it was, or it refuses and names Crank&ndash;Nicolson, which has no such restriction. For the wave equation the Courant number must not exceed 1, and at exactly 1 the scheme is <b>exact</b> for the 1D wave equation.",
        "<b>Differential-algebraic systems</b> &mdash; y&prime; = f(t, y, z) with 0 = g(t, y, z), semi-explicit and <b>index 1 only</b>. The constraint is imposed at every step, so it holds by construction and never drifts. <b>Index &ge; 2 is refused by name:</b> the Cartesian pendulum is index 3 because its constraint never mentions the multiplier, and an index-1 method run on it can return a plausible pendulum that slides off its own constraint. Inconsistent initial values are projected onto the constraint and the result reports both the original residual and where it actually started.",
        "<b>Data → insights</b> — paste a table and get per-column summaries, a correlation matrix (Pearson r + p-value, Spearman ρ), trend detection, outlier/missing flags, and plain-language findings.",
        "Matrices insert as clean, editable <b>Word tables</b>; spectra and trajectories insert as charts."
      ],
      examples:[
        {in:"Solve A·x=b:  A = [[2,1],[1,-1]], b = [5,1]", out:"x = [2, 1]"},
        {in:"Eigenvalues of [[0,-1],[1,0]]", out:"±i (complex pair)"},
        {in:"Minimize (1-x)^2 + 100*(y-x^2)^2", out:"min ≈ 0 at x=1, y=1"},
        {in:"BVP:  y'' = -y  on [0, π/2],  y = 0, 1", out:"sin x — <em>observed convergence order 2.00</em>, error estimate 9.0e−6"},
        {note:"The same BVP on [0, π] with y = 0, 0 has infinitely many solutions, and with y = 0, 1 it has none. Both are ordinary-looking inputs, so every result says it reports ONE solution and cannot tell you which case you are in."},
        {in:"Heat:  u_t = u_xx,  u(x,0) = sin(pi*x),  t = 0.1", out:"peak decays 1.0000 → 0.3729; both ends held at 0"},
        {in:"Heat, explicit FTCS with too large a Δt", out:"Δt <em>reduced</em> to satisfy r ≤ ½, and the result says so"},
        {in:"Wave:  u_tt = u_xx,  same start,  t = 1", out:"amplitude 1.0000 → 1.0000 — a wave does not decay, unlike heat"},
        {in:"DAE:  y' = -z,  0 = z - y,  y = 1, z = 1", out:"y = e⁻ᵗ, with z tracking y to machine precision at every step"},
        {in:"DAE with an inconsistent start (z = 5)", out:"says the values were INCONSISTENT, reports |g| = 4, and starts from the projected point"},
        {note:"The Cartesian pendulum — x'=u, y'=v, u'=−λx, v'=−λy−g, 0 = x²+y²−L² — is REFUSED: ∂g/∂λ is identically zero, so it is index 3, not index 1. An index-1 method run on it can return a plausible pendulum that slides off its own constraint."},
        {note:"Paste a dose/response table → \"dose and response are strongly positively correlated (r = 0.99, p < 0.001); response shows a significant increasing trend.\""}
      ] },
    chemical: { title:"Chemical", tagline:"Correctly formatted chemical formulas, offline 2D structures from a name/formula/SMILES, and a full physicochemical + pKa readout.",
      does:[
        "<b>Formatted formulas</b> with correct sub/superscripts — digits become subscripts, charges become superscripts.",
        "<b>2D structures</b>, fully offline, from a common <b>name</b> (359 built-in compounds), a <b>formula</b>, or a <b>SMILES</b> string; isomeric SMILES draw with wedge/hash stereochemistry.",
        "<b>Formula validator</b> — every element checked against the real 118-element periodic table, parentheses/hydrates balanced, with molecular weight and net charge (polyatomic ions handled).",
        "<b>Physicochemical properties &amp; druglikeness</b> — cLogP, logS, tPSA, H-bond donors/acceptors, rotatable bonds, plus the Lipinski Rule of Five and Veber screens.",
        "<b>pKa</b> — detects ionizable groups exactly, then <b>substituent-corrects</b> aromatic acids/bases (Hammett ρ·Σσ) and aliphatic acids (inductive) so the value is specific to your molecule (p-nitrophenol ≈ 7.15 vs phenol 9.99), with the derivation shown, plus the net charge at pH 7.4.",
        "<b>Online name → structure</b> (opt-in) — resolves an arbitrary systematic IUPAC name via OPSIN, with a consent prompt; everything else stays offline.",
        "<b>Periodic table &amp; atomic structure</b> — the table itself, a Bohr model, an orbital filling diagram, or a per-element summary. Configuration, shells, block, group and period are computed from the aufbau rule; names, oxidation states, electronegativity, ionisation energy, electron affinity and radius are fetched from PubChem and cross-checked against the symbols this product had already verified. Measured and predicted configurations are shown together where they differ, and the properties it does not carry — melting point, density, crystal structure, spectral lines — are listed as absent with the reason."
      ],

    spectra: { title:"Spectra", tagline:"Predicted ¹H/¹³C NMR, IR, UV-Vis and EI-MS fragmentation from a name or SMILES — computed on your machine. Estimates from published rules, never passed off as measured spectra.",
      does:[
        "<b>¹H NMR</b> — chemical shift, <b>integration</b> and <b>multiplicity</b> per signal, with resolved <b>J-coupling constants</b> and multiplet names (dd, td…), each with an assignment. Symmetry-aware, so benzene is one 6H singlet rather than six signals. Typical accuracy ±0.2–0.4 ppm.",

        "<b>¹³C NMR</b> — Grant–Paul additivity for sp³ carbons and benzene substituent increments for aromatics, with the carbonyl classes properly separated (ketone ≈ 205, aldehyde ≈ 199, acid ≈ 178, ester ≈ 171). Typical ±2–4 ppm.",
        "<b>IR</b> — characteristic group frequencies with published ranges, plus a simulated transmittance trace. Ester ≈ 1740 > ketone ≈ 1715 > amide ≈ 1660, and conjugation drops C=O by ~25 cm⁻¹.",
        "<b>UV-Vis</b> — λmax by the <b>Woodward–Fieser</b> rules with <b>every increment shown</b>, so you can audit the arithmetic rather than trust a number.",
        "<b>MS fragmentation</b> — exact fragment m/z via α-cleavage, benzylic→tropylium, McLafferty and gated neutral losses. Correctly ranks the real base peak for toluene (m/z 91), ethanol (31) and butylamine (30).",
        "Insert a <b>data table</b> or a <b>spectrum chart</b> — δ increases leftward and wavenumber decreases rightward, per convention.",
        "<b>Open a MEASURED spectrum (JCAMP-DX).</b> Everything above is predicted; this is the opposite. Point it at a <code>.jdx</code>, <code>.dx</code> or <code>.jcm</code> file from your instrument and it plots exactly what the file contains, labelled <i>measured</i> on the chart so the two can never be confused. Read on your machine, nothing uploaded. Long traces are reduced for drawing by keeping the <b>minimum and maximum of every bucket</b>, so a one-point peak survives — the obvious shortcut, keeping every n<sup>th</sup> point, drops narrow bands silently and leaves a tidy spectrum with a band missing.",
        "<b>Honest by construction.</b> Structure recognition is exact; the values are empirical estimates and every screen says so. Out-of-domain cases are disclosed rather than guessed: an unconjugated molecule reports <i>transparent</i> instead of a fabricated λmax, fused and heteroaromatic rings say they are approximate, and MS “likelihood” is a rule-based <b>ranking, not an intensity</b>."

    solve: { title:"Solve", tagline:"A no-code solver for equations, calculus and common word problems — deterministic and entirely offline.",
      does:[
        "<b>Solve an equation</b> — <code>LHS = RHS</code> for one unknown. Linear and quadratic are exact; <b>any higher-degree polynomial returns every root, real and complex</b> (<code>x^3 - 1 = 0</code> → 1 and −0.5 ± 0.866i, repeated roots marked). Only transcendental equations (e.g. <code>cos(x) = 0</code>) are limited to real roots in a scanned range. Identities and no-solution cases are reported as such.",
        "<b>Inequalities</b> — <code>x^2 - 4 &gt; 0</code> &rarr; (&minus;&infin;, &minus;2) &cup; (2, &infin;), by sign analysis on the critical points. Nothing is multiplied through by an expression whose sign is unknown &mdash; which is how this usually goes wrong. <code>1/x &lt; 1</code> keeps the negative branch a naive multiply loses, and a pole is excluded even from a non-strict comparison.",
        "<b>Systems of equations</b> — several equations, one per line. Linear systems solved <b>exactly</b> by rational row reduction and, crucially, <b>classified</b>: one solution, none, or <b>infinitely many</b> — and an underdetermined system returns its general solution with the free variables named, rather than one arbitrary point presented as the answer. Nonlinear systems go to Newton, every root checked by substitution.",
        "<b>Rearrange a formula</b> — an equation with several symbols offers a choice of which one to solve for: <code>F = m*a</code> solved for <code>a</code> is <code>F/m</code>, exactly, with the other symbols carried through (quadratics use the quadratic formula symbolically). Every division the rearrangement introduces states its ≠ 0 condition, and every answer is verified by substituting it back. Built on a new CAS core with exact rational arithmetic — <code>1/3 + 1/3 + 1/3</code> is exactly 1, and <code>x/x</code> cancels to 1.",
        "<b>Limits and series</b> — <code>limit sin(x)/x as x -&gt; 0</code> &rarr; 1 (L&#39;H&ocirc;pital where needed, every answer cross-checked numerically), one-sided limits and limits at infinity. A two-sided limit that <b>does not exist</b> is reported as such &mdash; <code>abs(x)/x</code> gives &minus;1 from below and +1 from above, and answering &ldquo;1&rdquo; would simply be wrong. Plus <b>Taylor/Maclaurin series</b> with exact rational coefficients and the truncation always shown.",
        "<b>Differentiate</b> — a <b>symbolic</b> derivative (product, quotient, chain and power rules; trig, exp/log, hyperbolic).",
        "<b>Symbolic integration</b> — substitution, by parts and partial fractions: <code>x*exp(x)</code> → <code>exp(x)(x−1)</code>, <code>1/(x^2+4)</code> → <code>atan(x/2)/2</code>, <code>ln(x)</code> → <code>x·ln(x) − x</code>. Every antiderivative is <b>checked by differentiating it back</b>, so a wrong closed form cannot reach you; anything with no elementary form is refused and integrated numerically instead.",
        "<b>Definite integral</b> — <b>exact</b> where a closed form exists (shows the antiderivative), numeric (adaptive Simpson) where none does, and <b>no value at all</b> when the integrand is undefined somewhere in the interval — <code>ln(x)</code> from −1 to 2 has no integral, and it says so rather than returning a number. Limits may be expressions like <code>pi/2</code>.",
        "<b>Inserts real Word equations</b> — the derivation arrives as editable OMML, fractions drawn as fractions and ∫ with its limits, rather than flat text.",
        "<b>Geometry</b> — mensuration exact in π; triangle solving including the <b>ambiguous SSA case</b> (two answers, one, or none — and it says which, where most solvers quietly return one); analytic geometry on exact rational coordinates; triangle centres with the Euler line verified; and <b>conic classification</b> — type <code>x^2/9 + y^2/4 = 1</code> and get the type, centre, foci, vertices and eccentricity, with degenerate cases named rather than dressed up as ellipses.",
        "<b>3D geometry</b> — vectors (dot, cross, triple product, projection), planes through three points, point-to-plane distance, line-plane intersection, tetrahedron volumes and the sphere through four points. Two lines are classified <b>exactly</b> as identical, parallel, intersecting or <b>skew</b>, with the distance between them — the four cases are genuinely different answers, and exact arithmetic means the classification needs no tolerance. Collinear or coplanar input is refused by name rather than divided through.",
        "<b>Algebraic topology</b> — integral <b>simplicial homology</b> of a named space (torus, Klein bottle, ℝP², spheres) or your own complex: Betti numbers, <b>torsion</b> and the Euler characteristic, computed over ℤ by Smith Normal Form. Torsion is the point — H₁(ℝP²) = <code>Z/2</code>, which a field-coefficient Betti number discards silently. Every result cross-checks its Euler characteristic two independent ways.",
        "<b>Persistent homology</b> — paste a <b>point cloud</b> and get a <b>barcode</b>: which holes in your data are real, and which are sampling noise. A ring and a blob have the same mean and spread and differ in H&#8321; — no summary statistic sees that. Vietoris&#8211;Rips over &#120125;&#8322;, with the barcode inserted as a figure. Every limit is stated, including the one that matters most: when the complex is capped below the dimension that would fill a loop in, the affected bars are reported as <b>unreliable</b> rather than quietly incomplete.",
        "<b>Advanced topology</b> — <b>cellular homology</b> (&#8477;P&#178; from three cells, not thirty-one simplices), <b>characteristic classes</b> (Stiefel&#8211;Whitney and Chern by the splitting principle, exact), and <b>unoriented cobordism</b> &mdash; where Stiefel&#8211;Whitney numbers are a <i>complete</i> invariant, making &#8220;does this bound?&#8221; genuinely decidable, and it is computed rather than asserted. Ask about the fundamental group or homeomorphism and it explains what is computable and what provably is not, instead of guessing.",
        "<b>Serre spectral sequences &amp; stable homotopy</b> &mdash; the <b>E&#8322; page</b> of a fibration, laid out as a grid with q upward the way you would draw it. Every possible differential is <b>marked UNDETERMINED, never guessed</b>: S&#185; &rarr; E &rarr; S&#178; has one d&#8322; that is an isomorphism for the Hopf fibration and zero for the trivial bundle &mdash; the <i>same page</i> with two different answers &mdash; so no H*(E) is claimed. Where the sequence <b>collapses</b> that is <b>proved</b> first, and what comes back is the associated graded with the extension problem named. <b>Stable homotopy groups of spheres</b> are a <b>cited table</b> (Hatcher, Toda), labelled a lookup on every result; past the tabulated range it says so rather than continuing the pattern.",
        "<b>Alexander polynomial &amp; K-theory</b> — &Delta;(t) from a braid by the reduced Burau representation, exact over the integers, with the knot determinant and the &Delta;(t) = &Delta;(1/t) symmetry checked on every result. It demonstrates its own weakness honestly: the two trefoils share an Alexander polynomial where Jones tells them apart. Plus K-theory wherever Bott periodicity settles it &mdash; spheres, CP&#8319;, a point, the torus.",
        "<b>Knot theory</b> — the <b>Jones polynomial</b> from a braid word, computed exactly by the Kauffman bracket state sum. The two trefoils get <i>different</i> polynomials &mdash; the invariant detecting chirality where homology cannot &mdash; and the figure-eight comes back palindromic, as an amphichiral knot must. Plus &pi;&#8321; of the complement as a Wirtinger presentation. Stated plainly: the Jones polynomial is <b>not a complete invariant</b>, so a match is evidence and never proof, and &pi;&#8321; is presented and abelianised but never identified.",
        "<b>Word problem</b> — offline templates for percentages, distance = rate × time, and simple “a number …” sentences translated to an equation and solved.",
        "Type <code>^</code> for powers (<code>x^2</code>); pasted superscripts (<code>x²</code>) work too. Exact results are labelled exact; numeric ones state their limits, and it says so rather than inventing an answer it can’t parse.",
        "<b>Two-body problems</b> \u2014 distance/rate/time where things approach or separate, with the combined rate shown in the working. Anything the templates cannot represent is refused rather than answered from whichever number appeared first.",
      ],
      examples:[
        {in:"x^2 - 5x + 6 = 0", out:"x = 3, 2 (exact, quadratic)"},
        {in:"x^2 + 1 = 0", out:"0 + 1i, 0 − 1i (complex pair, flagged)"},
        {in:"F = m*a, solve for a", out:"a = F/m — requires m ≠ 0"},
        {in:"differentiate sin(x)*cos(x)", out:"cos(x)^2 - sin(x)^2"},
        {in:"differentiate sin(x^2)", out:"2*x*cos(x^2)"},
        {in:"∫ x^2 from 0 to 3", out:"9 — exact (symbolic), F(x) = x^3/3"},
        {in:"12 is what percent of 48?", out:"25%"},
        {in:"serre s2 s1", out:"the E₂ page, with the one possible d₂ marked UNDETERMINED — no H*(E) claimed"},
        {in:"stable pi_3", out:"π₃ˢ = Z/24 — labelled a LOOKUP from a published table, not a computation"},
        {in:"alexander trefoil", out:"Δ(t) = 1 − t + t², determinant 3, symmetry Δ(t) = Δ(1/t) checked"},
        {note:"An analysis aid — verify before relying."}
      ] },
    seqmap: { title:"Sequence Map", tagline:"Open a GenBank / FASTA / SnapGene file and insert an annotated linear or circular map — read on your machine, nothing uploaded.",
      does:[
        "<b>GenBank</b> (.gb/.gbk/.gbff) draws a real map — it carries the feature annotations (promoters, CDS, resistance markers, origins) and topology, with the full location grammar (ranges, partial bounds, <code>complement</code>, <code>join</code>).",
        "<b>FASTA</b> gives the backbone and scale only — it has no features or topology, and the tool never guesses them.",
        "<b>SnapGene</b> (.dna) is read where possible; it falls back to “export as GenBank” with a message rather than a wrong sequence.",
        "Plasmids draw as <b>circular</b> maps, linear constructs as linear; <b>Auto</b> follows the record’s own topology. Joined CDS draw as segmented arrows; restriction sites can be overlaid; a black-and-white <b>patent-figure</b> style is available.",
        "Format is sniffed by content, not extension. Files are read locally as bytes — nothing is uploaded."
      ],
      examples:[
        {in:"a plasmid GenBank record", out:"a circular map with feature arcs, labels and a bp scale"},
        {note:"Methylation changes what actually cuts — MboI/DpnI warnings appear under the digest table."}
      ] },
    align: { title:"Align", tagline:"Pairwise sequence alignment — global or local, with affine gaps — the algorithms EMBOSS needle and water run.",
      does:[
        "<b>Global (Needleman–Wunsch)</b> forces an end-to-end alignment — use it when the two sequences are the same thing (a clone vs its reference, two alleles).",
        "<b>Local (Smith–Waterman)</b> finds the best shared segment — use it when they share only a domain or differ a lot in length.",
        "<b>Affine gaps</b> (Gotoh), default gap open 10 / extend 0.5; <b>BLOSUM62</b> for protein or +5/−4 for DNA; sequence type auto-detects conservatively.",
        "Reports identities, similarities, gaps and 1-based spans; the ruler uses <code>|</code> (identical) and <code>:</code> (similar). Inserts in a monospace font so the columns line up.",
        "Percent identity is a fact about the <em>alignment</em>, not the sequences — it moves with the gap costs, and below ~25% (the twilight zone) unrelated proteins still align convincingly; the tool says so."
      ],
      examples:[
        {in:"two ~90%-identical proteins, global", out:"a full-length alignment, Identity 20/22 (90.9%)"},
        {note:"Paste plain sequence or FASTA; headers and whitespace are stripped."}
      ] }
  };

  const ORDER = ["analyze","engineering","chemical","massspec","spectra","bioassay","peptide","stats","math","solve","units","plot","tablechart","finance","build","code","sequence","botanical","numerals","refs","citations","dna","seqmap","align","reaction","audit"];

  const params = new URLSearchParams(location.search);
  const id = params.get("tool");
  const t = TOOLS[id];
  const titleEl = document.getElementById("title");
  const tagEl = document.getElementById("tagline");
  const content = document.getElementById("content");
  const nav = document.getElementById("nav");

  if (!t) {
    titleEl.textContent = "Tool not found";
    tagEl.textContent = "";
    content.innerHTML = '<div class="missing"><p>That tool isn’t recognized. <a href="index.html">See all 26 tools →</a></p></div>';
  } else {
    document.title = t.title + " — JurisLab";
    titleEl.textContent = t.title;
    tagEl.textContent = t.tagline;

    let html = "<section><h2>What it does</h2><ul class=\"does\">";
    for (const d of t.does) html += "<li>" + d + "</li>";
    html += "</ul></section>";

    html += "<section><h2>Examples</h2><div class=\"examples\">";
    for (const ex of t.examples) {
      html += '<div class="ex">';
      if (ex.in !== undefined) {
        html += '<div class="io"><span class="in"></span><span class="arrow">→</span><span class="out"></span></div>';
      }
      if (ex.note) html += '<div class="note">' + ex.note + "</div>";
      html += "</div>";
    }
    html += "</div></section>";

    html += '<section><div class="note-box"><strong>Private by design.</strong> This tool runs entirely on your machine — nothing you type leaves your computer. (The one exception across the whole add-in is the optional online name→structure lookup in Chemical mode, which prompts for consent before sending.)</div></section>';

    content.innerHTML = html;

    // Fill code text safely (textContent avoids any escaping surprises).
    const ios = content.querySelectorAll(".io");
    let k = 0;
    for (const ex of t.examples) {
      if (ex.in !== undefined) {
        const io = ios[k++];
        io.querySelector(".in").textContent = ex.in;
        io.querySelector(".out").innerHTML = ex.out; // out may contain <em> for names
      }
    }

    // prev / next
    const i = ORDER.indexOf(id);
    const prev = i > 0 ? ORDER[i - 1] : ORDER[ORDER.length - 1];
    const next = i < ORDER.length - 1 ? ORDER[i + 1] : ORDER[0];
    nav.innerHTML =
      '<a class="prev" href="tool.html?tool=' + prev + '"><small>← Previous</small>' + TOOLS[prev].title + "</a>" +
      '<a class="next" href="tool.html?tool=' + next + '"><small>Next →</small>' + TOOLS[next].title + "</a>";
  }
  </script>
</body>
</html>
