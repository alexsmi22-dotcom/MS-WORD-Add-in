<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JurisLab — Drawing canvas</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      #editor {
        flex: 1 1 auto;
        min-height: 0;
      }
      #bar {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid #d0d0d0;
        background: #f7f7f7;
      }
      #use-btn {
        padding: 8px 18px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 4px;
        background: #38bdf8;
        color: #062033;
        cursor: pointer;
      }
      #cancel-btn {
        padding: 8px 14px;
        font-size: 14px;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      #info {
        margin-left: auto;
        font-size: 12.5px;
        color: #555;
      }
      #error {
        color: #b00020;
        font-size: 13px;
        padding: 6px 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="editor" aria-label="Structure drawing canvas"></div>
    <div id="error"></div>
    <div id="bar">
      <button id="use-btn" type="button">Use this drawing</button>
      <button id="cancel-btn" type="button">Cancel</button>
      <span id="info"></span>
    </div>
  </body>
</html>
