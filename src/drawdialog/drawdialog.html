<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JurisLab — Drawing canvas</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      #tabs {
        flex: 0 0 auto;
        display: flex;
        gap: 2px;
        padding: 8px 12px 0;
        border-bottom: 1px solid #d0d0d0;
        background: #f7f7f7;
      }
      .tab-btn {
        padding: 7px 16px;
        font-size: 13.5px;
        border: 1px solid #d0d0d0;
        border-bottom: none;
        border-radius: 6px 6px 0 0;
        background: #ececec;
        cursor: pointer;
        color: #444;
      }
      .tab-btn.active {
        background: #fff;
        font-weight: 600;
        color: #111;
        position: relative;
        top: 1px;
      }
      #editor {
        flex: 1 1 auto;
        min-height: 0;
      }
      #view3d-wrap {
        flex: 1 1 auto;
        min-height: 0;
        display: none;
        flex-direction: column;
      }
      #view3d-controls {
        flex: 0 0 auto;
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 8px 12px;
        font-size: 13px;
        background: #fbfbfb;
        border-bottom: 1px solid #e4e4e4;
        flex-wrap: wrap;
      }
      #view3d-controls label {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      #style3d {
        font-size: 13px;
        padding: 3px 6px;
      }
      #canvas3d {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        cursor: grab;
        touch-action: none;
        display: block;
      }
      #canvas3d:active {
        cursor: grabbing;
      }
      #note3d {
        flex: 0 0 auto;
        font-size: 12px;
        color: #666;
        padding: 6px 12px;
        border-top: 1px solid #eee;
        min-height: 20px;
      }
      #bar {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid #d0d0d0;
        background: #f7f7f7;
      }
      #use-btn,
      #use3d-btn {
        padding: 8px 18px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 4px;
        background: #38bdf8;
        color: #062033;
        cursor: pointer;
      }
      #use3d-btn {
        display: none;
      }
      #cancel-btn,
      #clean-btn,
      #reset3d-btn {
        padding: 8px 14px;
        font-size: 14px;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      #reset3d-btn,
      .edit3d-btn {
        padding: 4px 10px;
        font-size: 12.5px;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .elem3d-btn {
        padding: 3px 8px;
        font-size: 12.5px;
        font-weight: 600;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        margin-right: 2px;
      }
      #tpl3d,
      #tpl2d,
      #attach3d {
        font-size: 12.5px;
        padding: 3px 6px;
        max-width: 170px;
      }
      #info {
        margin-left: auto;
        font-size: 12.5px;
        color: #555;
      }
      #error {
        color: #b00020;
        font-size: 13px;
        padding: 6px 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="tabs">
      <button id="tab-2d" class="tab-btn active" type="button" aria-selected="true">2D editor</button>
      <button id="tab-3d" class="tab-btn" type="button" aria-selected="false">3D model</button>
    </div>
    <div id="editor" aria-label="Structure drawing canvas"></div>
    <div id="view3d-wrap">
      <div id="view3d-controls">
        <label>Style
          <select id="style3d">
            <option value="ballstick" selected>Ball and stick</option>
            <option value="stick">Stick</option>
            <option value="spacefill">Space-filling</option>
          </select>
        </label>
        <label><input type="checkbox" id="show-h" checked /> Hydrogens</label>
        <label><input type="checkbox" id="labels3d" checked /> Labels</label>
        <label><input type="checkbox" id="spin3d" /> Spin</label>
        <button id="reset3d-btn" type="button">Reset view</button>
        <select id="tpl3d"></select>
        <span style="color:#888">drag rotates · scroll zooms · click an atom or bond to EDIT</span>
      </div>
      <div id="edit3d-bar" style="display:none; flex: 0 0 auto; align-items:center; gap:8px; padding:6px 12px; font-size:13px; background:#eef7fc; border-bottom:1px solid #d5e9f5; flex-wrap:wrap;">
        <span id="edit3d-what" style="font-weight:600"></span>
        <span id="elem3d"></span>
        <select id="attach3d"></select>
        <button id="del-atom3d" class="edit3d-btn" type="button">Delete atom</button>
        <span id="bond3d-btns">
          <button id="bond3d-1" class="edit3d-btn" type="button">Single</button>
          <button id="bond3d-2" class="edit3d-btn" type="button">Double</button>
          <button id="bond3d-3" class="edit3d-btn" type="button">Triple</button>
          <button id="del-bond3d" class="edit3d-btn" type="button">Delete bond</button>
        </span>
        <button id="deselect3d" class="edit3d-btn" type="button">Done</button>
      </div>
      <canvas id="canvas3d" aria-label="3D molecular model"></canvas>
      <div id="note3d"></div>
    </div>
    <div id="error"></div>
    <div id="bar">
      <button id="use-btn" type="button">Use this drawing</button>
      <button id="use3d-btn" type="button">Insert 3D picture</button>
      <button id="clean-btn" type="button">Clean structure</button>
      <select id="tpl2d"></select>
      <button id="cancel-btn" type="button">Cancel</button>
      <span id="info"></span>
    </div>
  </body>
</html>
