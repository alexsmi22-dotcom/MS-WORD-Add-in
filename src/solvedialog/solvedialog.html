<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JurisLab — Equation canvas</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      #typeset {
        flex: 0 0 auto;
        min-height: 96px;
        max-height: 30vh;
        overflow: auto;
        padding: 18px 20px;
        font-size: 26px;
        border-bottom: 1px solid #e2e2e2;
        background: #fcfcfb;
      }
      #typeset .line {
        margin: 4px 0;
      }
      #typeset .hint {
        font-size: 14px;
        color: #888;
      }
      #figure {
        flex: 0 0 auto;
        max-height: 42vh;
        overflow: auto;
        padding: 8px 20px;
        border-bottom: 1px solid #e2e2e2;
        display: none;
        text-align: center;
      }
      #figure svg {
        max-width: 100%;
        height: auto;
      }
      #input {
        flex: 0 0 auto;
        width: 100%;
        border: none;
        border-bottom: 1px solid #e2e2e2;
        padding: 12px 20px;
        font-size: 18px;
        font-family: "Cascadia Code", Consolas, monospace;
        resize: none;
        outline: none;
        min-height: 74px;
      }
      #status {
        flex: 0 0 auto;
        padding: 4px 20px 6px;
        font-size: 13px;
        color: #555;
        min-height: 24px;
      }
      #status.bad {
        color: #b00020;
      }
      #palette {
        flex: 1 1 auto;
        overflow: auto;
        padding: 8px 16px 12px;
      }
      .group-label {
        margin: 10px 0 4px;
        font-size: 11.5px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #666;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .pal-btn {
        padding: 7px 12px;
        font-size: 15px;
        border: 1px solid #d0d0d0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      .pal-btn:hover {
        border-color: #0c4a6e;
      }
      #bar {
        flex: 0 0 auto;
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid #d0d0d0;
        background: #f7f7f7;
      }
      #use-btn {
        padding: 8px 18px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 4px;
        background: #38bdf8;
        color: #062033;
        cursor: pointer;
      }
      #cancel-btn {
        padding: 8px 14px;
        font-size: 14px;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
      }
      #error {
        color: #b00020;
        font-size: 13px;
        padding: 6px 12px;
        display: none;
      }
      #paste-note {
        padding: 2px 20px;
        font-size: 12px;
        color: #7a5f00;
      }
      #paste-note:empty {
        display: none;
      }
      #result {
        padding: 4px 20px 8px;
        font-size: 14px;
        border-bottom: 1px solid #e2e2e2;
      }
      #result:empty {
        display: none;
      }
      .result-title {
        font-weight: 600;
        margin: 2px 0;
      }
      .result-line {
        margin: 1px 0;
      }
      .result-math {
        font-size: 17px;
        margin: 3px 0;
      }
      .caveat {
        font-size: 12px;
        color: #7a5f00;
      }
      .chip-row {
        margin-top: 6px;
        font-size: 13px;
      }
      .chip {
        margin: 0 3px;
        padding: 3px 10px;
        border: 1px solid #c0c0c0;
        border-radius: 999px;
        background: #fff;
        cursor: pointer;
      }
      .chip.is-on {
        background: #0c4a6e;
        color: #fff;
        border-color: #0c4a6e;
      }
      #bounds-row,
      #graph-controls {
        display: flex;
        gap: 6px;
        align-items: center;
        padding: 6px 20px;
        font-size: 13px;
        color: #555;
      }
      #bounds-row input,
      #graph-controls input {
        width: 70px;
        padding: 4px 8px;
        font-size: 13px;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
      }
      .hint-sm {
        font-size: 11.5px;
        color: #888;
      }
      #graph {
        padding: 4px 20px 8px;
        border-bottom: 1px solid #e2e2e2;
        text-align: center;
        display: none;
      }
      #graph svg {
        max-width: 100%;
        height: auto;
      }
      .graph-note {
        font-size: 12px;
        color: #7a5f00;
        text-align: left;
      }
      #lib-search {
        margin: 8px 16px 0;
        padding: 6px 10px;
        font-size: 13px;
        border: 1px solid #c0c0c0;
        border-radius: 4px;
        width: calc(100% - 32px);
      }
    </style>
  </head>
  <body>
    <div id="typeset" aria-live="polite"></div>
    <div id="figure" aria-live="polite"></div>
    <textarea id="input" rows="3" spellcheck="false" autocomplete="off"
      placeholder="Type, click symbols, or PASTE from anywhere — 𝑥, θ, LaTeX and √ are all understood"></textarea>
    <div id="paste-note" aria-live="polite"></div>
    <div id="bounds-row" style="display:none">
      <label for="bound-a">from</label><input id="bound-a" type="text" placeholder="0" />
      <label for="bound-b">to</label><input id="bound-b" type="text" placeholder="1" />
      <span class="hint-sm">leave both empty for the antiderivative</span>
    </div>
    <div id="status" aria-live="polite"></div>
    <div id="result" aria-live="polite"></div>
    <div id="graph-controls">
      <label for="graph-from">x from</label><input id="graph-from" type="text" value="-10" />
      <label for="graph-to">to</label><input id="graph-to" type="text" value="10" />
      <span class="hint-sm">one curve per line — an equation graphs both sides, crossings are the solutions</span>
    </div>
    <div id="graph" aria-live="polite"></div>
    <input id="lib-search" type="text" placeholder="Search symbols &amp; equations — try “gas”, “energy”, “√”" />
    <div id="palette"></div>
    <div id="error"></div>
    <div id="bar">
      <button id="use-btn" type="button">Use this equation</button>
      <button id="cancel-btn" type="button">Cancel</button>
      <span style="margin-left:auto;font-size:12.5px;color:#555" id="info"></span>
    </div>
  </body>
</html>
