    solve: { title:"Solve", tagline:"A no-code solver for equations, calculus and common word problems — deterministic and entirely offline.",
      does:[
        "<b>Significant figures</b>, with the steps: count them (“1200” is ambiguous — said so), round to n figures, arithmetic by the textbook rules (× ÷ fewest figures, + − fewest decimal places; counts are exact), and round a result to its uncertainty (10.0 ± 0.123 → 10.0 ± 0.1).",
        "<b>Monte Carlo uncertainty</b>: <code>monte carlo a*b/c a = 10.0 ± 0.1, b = 4.00 ± 0.05, c = 2.0 ± 0.1</code> → 10⁵ seeded draws, mean, SD and the 95 % interval, a histogram, and whether the first-order (GUM) result agrees (JCGM 101 §8).",
        "<b>Linear programming</b> — <code>maximize 3x + 2y subject to x + y &lt;= 4, x + 3y &lt;= 6, x, y &gt;= 0</code> → (4, 0), z = 12 by an exact two-phase simplex (rational tableau, Bland's rule), the standard form with slacks, each constraint's slack and whether it binds, shadow prices (3, 0), reduced costs, objective and right-hand-side ranges, every claim verified by dual feasibility, complementary slackness and strong duality — and for two variables by an independent vertex enumeration; <code>dual of …</code>, <code>standard form of …</code>, <code>simplex tableau for …</code>, <code>graphically solve …</code>; <code>… x and y integer</code> → the LP relaxation labelled, then branch-and-bound (≤ 4 variables); unbounded → the ray, infeasible → the contradicting constraints named, alternative optima → the edge; a missing non-negativity is never silently added — both answers are printed and labelled; the feasible region drawn with the objective contour. One prose template (products × resources); transportation, assignment and diet in prose are refused by name with the typed form shown.",
        "<b>Interpolation and splines</b> — <code>interpolate (1, 2), (2, 3), (4, 7)</code> → p(x) = 1/3·x² + 5/3 exactly (Vandermonde, Lagrange and Newton cross-checked as rationals), the Newton table, <code>at x = 3</code> → 14/3; <code>neville's method … at x = 1.5</code> with the tableau; linear interpolation with the proportion line; the error bound with M stated; <code>natural cubic spline through (0, 0), (1, 1), (2, 0)</code> → M = (0, −3, 0) and one cubic per interval with S, S′, S″ continuity verified exactly; clamped, not-a-knot, linear and PCHIP; each piece drawn on its own interval. A least-squares fit is refused by name (Sketch data → function does that).",
        "<b>Probability</b> — <code>binomial n=10 p=0.4 P(X &lt;= 3)</code> → 3733209/9765625 ≈ 0.382281 exact, the formula line, the pmf drawn with the event shaded; <code>poisson lambda = 2.5 P(X &gt;= 3)</code>; <code>normal mean 100 sd 15 P(X &gt; 120)</code> → z = 4/3, 1 − Φ(4/3), the tail shaded; <code>quantile normal 0.975</code>, <code>critical value chi-square 3 df alpha 0.05</code>, <code>t 12 df P(T &gt; 2.1)</code>, exponential, uniform, gamma, beta, geometric (trials convention, said), negative binomial, hypergeometric; moments, mgfs, pmf tables; every value cross-checked by an independent route. <code>bayes P(A)=0.01, P(B|A)=0.9, P(B|not A)=0.05, P(A|B)</code> → 2/13 with the tree — independence never assumed; <code>expected value of a fair die</code> → 7/2; <code>probability of at least one six in four rolls</code> → 671/1296 (the classic prose problems exactly, refusal by name outside them); <code>confidence interval 95% mean 50 sd 10 n 30</code> with z and t both shown; normal approximation only as an explicit verb with the correction stated.",
        "<b>Markov chains</b> — <code>markov [[0.9, 0.1], [0.5, 0.5]] stationary</code> → π = (5/6, 1/6) exactly (rational rref), irreducible/aperiodic classification, the limit declared only when it exists (<code>[[0,1],[1,0]]</code>: period 2, no limit, by name), <code>after 3 steps from (1,0)</code> by exact powers, <code>absorbing markov chain [[1,0,0],[0.3,0.4,0.3],[0,0,1]] expected steps</code> → N = (I − Q)⁻¹ exact, the state diagram drawn; a row not summing to 1 refused with the sum shown.",
        "<b>Multivariable calculus</b> — <code>gradient x^2 y + y^3 at (1,2)</code> → ∇f = (2xy, x² + 3y²), ∇f(1,2) = (4, 13), every partial checked by central differences; <code>directional derivative … in direction (3,4)</code> (normalised for you); <code>hessian</code> with det H; <code>jacobian (r cos(theta), r sin(theta))</code> → det J = r; <code>critical points x^3 - 3x + y^2</code> → (1, 0) local minimum, (−1, 0) saddle point by exact elimination and the second-derivative test, <b>INCONCLUSIVE</b> said when D = 0; <code>lagrange x y subject to x^2 + y^2 = 1</code> → ±1/2 at (±√2/2, ±√2/2), max and min declared only on a bounded constraint; <code>double integral x^2 + y^2 over y from 0 to x, x from 0 to 1</code> → 1/3; <code>divergence</code>, <code>curl</code>, <code>potential</code> (φ or refused with the curl shown), <code>line integral</code> for conservative fields — path-dependent ones refused by name.",
        "<b>Laplace transforms</b> — <code>laplace t^2 exp(3t)</code> → F(s) = 2/(s − 3)³ for s &gt; 3, the table rule named per term; tⁿ, e^{at}, sin, cos, sinh, cosh and their products (squares and products reduced by identity), the unit step <code>u(t-2)</code> by the second shift theorem, the impulse <code>delta(t-3)</code>. Every result is <b>checked against the defining integral</b> ∫₀^∞ e^{−st} f(t) dt at three values of s; 1/t, ln t and exp(t²) are refused by name. <code>inverse laplace 1/(s*(s+1))</code> → 1 − e^{−t} by partial fractions; an irrational ω stays a square root (<code>1/(s^3+1)</code> carries √3); <code>exp(-2s)/s</code> → u(t − 2). An inverse is transformed forward again before it is shown.",
        "<b>Initial-value problems</b> (ODE kind) — <code>y&#39;&#39; + 4y = sin(t), y(0) = 0, y&#39;(0) = 0</code> → y = sin(t)/3 − sin(2t)/6 by Laplace transform: Y(s) assembled from the transformed equation, inverted, and <b>verified by substituting y back</b> into the original equation and the initial conditions; the single solution is drawn. Constant-coefficient, order ≤ 2, forcing in the table (step forcings included).",
        "<b>Fourier series</b> — <code>fourier series t^2 on (-pi, pi)</code> → a₀/2 = π²/3, aₙ = 4(−1)ⁿ/n², <b>exact and symbolic in n</b>; pieces separated by <code>;</code> (<code>-1 on (-pi, 0); 1 on (0, pi)</code> is the square wave), <code>abs(t)</code> split for you, exp(ct) pieces, sinusoids at a harmonic by orthogonality (<code>cos(t)</code> is its own series — no 0/0). Coefficients verified against numerical integration for n ≤ 5; the partial sum S₅ drawn over f; every jump named with its midpoint convergence and Gibbs overshoot.",
        "<b>Solve an equation — showing its work</b> — <code>LHS = RHS</code> for one unknown, with the derivation a student would write: linear solves show collect → divide → answer, quadratics <b>factor</b> when a student could ((x − 2)(x − 3) = 0) and otherwise show the formula with the numbers substituted, and the worked lines <b>insert into Word as real equations</b>. Linear and quadratic are exact; <b>any higher-degree polynomial returns every root, real and complex</b> (repeated roots marked; full factorisation shown when every root is rational). Only transcendental equations (e.g. <code>cos(x) = 0</code>) are limited to real roots in a scanned range. Identities and no-solution cases are reported as such. Derivatives show the rule at each level (chain, product, power); definite integrals write out F(b) − F(a).",
        "<b>Inequalities</b> — <code>x^2 - 4 &gt; 0</code> &rarr; (&minus;&infin;, &minus;2) &cup; (2, &infin;), by sign analysis on the critical points. Nothing is multiplied through by an expression whose sign is unknown &mdash; which is how this usually goes wrong. <code>1/x &lt; 1</code> keeps the negative branch a naive multiply loses, and a pole is excluded even from a non-strict comparison.",
        "<b>Systems of equations</b> — several equations, one per line. Linear systems solved <b>exactly</b> by rational row reduction and, crucially, <b>classified</b>: one solution, none, or <b>infinitely many</b> — and an underdetermined system returns its general solution with the free variables named, rather than one arbitrary point presented as the answer. Nonlinear systems go to Newton, every root checked by substitution.",
        "<b>Rearrange a formula</b> — an equation with several symbols offers a choice of which one to solve for: <code>F = m*a</code> solved for <code>a</code> is <code>F/m</code>, exactly, with the other symbols carried through (quadratics use the quadratic formula symbolically). Every division the rearrangement introduces states its ≠ 0 condition, and every answer is verified by substituting it back. Built on a new CAS core with exact rational arithmetic — <code>1/3 + 1/3 + 1/3</code> is exactly 1, and <code>x/x</code> cancels to 1.",
        "<b>Limits and series</b> — <code>limit sin(x)/x as x -&gt; 0</code> &rarr; 1 (L&#39;H&ocirc;pital where needed, every answer cross-checked numerically), one-sided limits and limits at infinity. A two-sided limit that <b>does not exist</b> is reported as such &mdash; <code>abs(x)/x</code> gives &minus;1 from below and +1 from above, and answering &ldquo;1&rdquo; would simply be wrong. Plus <b>Taylor/Maclaurin series</b> with exact rational coefficients and the truncation always shown.",
        "<b>Differentiate</b> — a <b>symbolic</b> derivative (product, quotient, chain and power rules; trig, exp/log, hyperbolic).",
        "<b>Symbolic integration</b> — substitution, by parts, partial fractions, <b>trig power reduction</b> (<code>sin(x)^2</code> → x/2 − sin(2x)/4) and the <b>cyclic-by-parts family</b> (<code>exp(x)*sin(x)</code> → eˣ(sin x − cos x)/2, general e^(ax)·sin/cos(cx)): <code>x*exp(x)</code> → <code>exp(x)(x−1)</code>, <code>1/(x^2+4)</code> → <code>atan(x/2)/2</code>, <code>ln(x)</code> → <code>x·ln(x) − x</code>. Every antiderivative is <b>checked by differentiating it back</b>, so a wrong closed form cannot reach you; anything with no elementary form is refused and integrated numerically instead.",
        "<b>Definite integral</b> — <b>exact</b> where a closed form exists (shows the antiderivative), numeric (adaptive Simpson) where none does, and <b>no value at all</b> when the integrand is undefined somewhere in the interval — <code>ln(x)</code> from −1 to 2 has no integral, and it says so rather than returning a number. Limits may be expressions like <code>pi/2</code>.",
        "<b>Inserts real Word equations</b> — the derivation arrives as editable OMML, fractions drawn as fractions and ∫ with its limits, rather than flat text.",
        "<b>Equation composer</b> — a palette under the input builds equations by click with <b>real symbols</b> (the √ sign itself, x², π, ≤ — not plain-english spellings), and an <b>equation library</b> (<code>F = m a</code>, <code>PV = nRT</code>, Pythagoras, kinematics, compound growth…) that loads ready to solve for <b>any</b> of its symbols via the solve-for chips. The input <b>draws itself as real mathematics</b> — radical bars, stacked fractions — live under the box.",
        "<b>Equation canvas — a workbench</b>: pop the composer out into a large window where the equation is drawn big as you build it, the <b>solution appears live</b> (roots with solve-for chips, systems classified, limits, integrals with bounds), and a <b>graphing calculator</b> plots one curve per line — an equation graphs both sides, so the crossings ARE the solutions; poles stay gaps, never walls. Searchable equation library at working size; the composite figure draws live for geometry.",
        "<b>Paste from anywhere</b> — equations copied from papers, Word or the web just work: math-italic letters (𝑥), Greek variables (θ, λ — solvable symbolically and typeset back as Greek), <b>LaTeX</b> (\\frac, \\sqrt, x^{2}), vulgar fractions (½, and 10½ read as ten-and-a-half), invisible characters. Every transformation is reported in a note; what has no single reading (±, ∂, ℝ) is named, never guessed.",
        "<b>Composite figures</b> — <code>rectangle 10in x 5in minus triangle b=4in h=3in</code> → the area <b>with</b> the triangle still counted (50 in²) and <b>without</b> it (44 in²), <b>exact</b> (π and surds survive: <code>rectangle 8 x 6 minus circle r=2</code> → <code>48 − 4π</code>), with a drawn, labelled figure. Cutouts and additions (<code>plus</code>), mixed units converted exactly, prose accepted — <i>“a rectangle 10&quot; × 5&quot; with a triangle inside, base 4&quot; height 3&quot;”</i>. The placement assumption is stated, an impossible cutout is refused, and a shape with missing dimensions is asked for them rather than guessed.",
        "<b>Geometry</b> — mensuration exact in π; triangle solving including the <b>ambiguous SSA case</b> (two answers, one, or none — and it says which, where most solvers quietly return one); analytic geometry on exact rational coordinates; triangle centres with the Euler line verified; and <b>conic classification</b> — type <code>x^2/9 + y^2/4 = 1</code> and get the type, centre, foci, vertices and eccentricity, with degenerate cases named rather than dressed up as ellipses.",
        "<b>3D geometry</b> — vectors (dot, cross, triple product, projection), planes through three points, point-to-plane distance, line-plane intersection, tetrahedron volumes and the sphere through four points. Two lines are classified <b>exactly</b> as identical, parallel, intersecting or <b>skew</b>, with the distance between them — the four cases are genuinely different answers, and exact arithmetic means the classification needs no tolerance. Collinear or coplanar input is refused by name rather than divided through.",
        "<b>Algebraic topology</b> — integral <b>simplicial homology</b> of a named space (torus, Klein bottle, ℝP², spheres) or your own complex: Betti numbers, <b>torsion</b> and the Euler characteristic, computed over ℤ by Smith Normal Form. Torsion is the point — H₁(ℝP²) = <code>Z/2</code>, which a field-coefficient Betti number discards silently. Every result cross-checks its Euler characteristic two independent ways.",
        "<b>Persistent homology</b> — paste a <b>point cloud</b> and get a <b>barcode</b>: which holes in your data are real, and which are sampling noise. A ring and a blob have the same mean and spread and differ in H&#8321; — no summary statistic sees that. Vietoris&#8211;Rips over &#120125;&#8322;, with the barcode inserted as a figure. Every limit is stated, including the one that matters most: when the complex is capped below the dimension that would fill a loop in, the affected bars are reported as <b>unreliable</b> rather than quietly incomplete.",
        "<b>Advanced topology</b> — <b>cellular homology</b> (&#8477;P&#178; from three cells, not thirty-one simplices), <b>characteristic classes</b> (Stiefel&#8211;Whitney and Chern by the splitting principle, exact), and <b>unoriented cobordism</b> &mdash; where Stiefel&#8211;Whitney numbers are a <i>complete</i> invariant, making &#8220;does this bound?&#8221; genuinely decidable, and it is computed rather than asserted. Ask about the fundamental group or homeomorphism and it explains what is computable and what provably is not, instead of guessing.",
        "<b>Serre spectral sequences &amp; stable homotopy</b> &mdash; the <b>E&#8322; page</b> of a fibration, laid out as a grid with q upward the way you would draw it. Every possible differential is <b>marked UNDETERMINED, never guessed</b>: S&#185; &rarr; E &rarr; S&#178; has one d&#8322; that is an isomorphism for the Hopf fibration and zero for the trivial bundle &mdash; the <i>same page</i> with two different answers &mdash; so no H*(E) is claimed. Where the sequence <b>collapses</b> that is <b>proved</b> first, and what comes back is the associated graded with the extension problem named. <b>Stable homotopy groups of spheres</b> are a <b>cited table</b> (Hatcher, Toda), labelled a lookup on every result; past the tabulated range it says so rather than continuing the pattern.",
        "<b>Alexander polynomial &amp; K-theory</b> — &Delta;(t) from a braid by the reduced Burau representation, exact over the integers, with the knot determinant and the &Delta;(t) = &Delta;(1/t) symmetry checked on every result. It demonstrates its own weakness honestly: the two trefoils share an Alexander polynomial where Jones tells them apart. Plus K-theory wherever Bott periodicity settles it &mdash; spheres, CP&#8319;, a point, the torus.",
        "<b>Knot theory</b> — the <b>Jones polynomial</b> from a braid word, computed exactly by the Kauffman bracket state sum. The two trefoils get <i>different</i> polynomials &mdash; the invariant detecting chirality where homology cannot &mdash; and the figure-eight comes back palindromic, as an amphichiral knot must. Plus &pi;&#8321; of the complement as a Wirtinger presentation. Stated plainly: the Jones polynomial is <b>not a complete invariant</b>, so a match is evidence and never proof, and &pi;&#8321; is presented and abelianised but never identified.",
        "<b>Constrained dynamics and topology</b> — differential-algebraic equations of any index (the Cartesian pendulum typed as written: index reduced, hidden constraints shown, drift measured against every constraint, stopped by name at a singular point), initial values bound by name; real K-theory (KO by Bott periodicity, K̃O⁰(ℝPⁿ) from Adams), K of products by Künneth; cobordism with # and × (Stiefel–Whitney and Pontryagin numbers, signature); persistent homology over any prime field with an automatic scale — Klein bottle, torus and ℝP² distinguished.",
        "<b>Reaction balancing</b> (Solve, and Reaction mode's Formulas reading) — <code>balance Fe + O2 -&gt; Fe2O3</code>, redox with charges and e⁻, half-reactions in acid or base; balanced by the exact null space of the element and charge matrix and recounted; two independent balancings are refused with both shown; an impossible reaction names the element or charge that fails. Stoichiometry: limiting reagent, theoretical and percent yield from masses, moles, solution volumes × molarity and gases at stated conditions (both STP definitions named, never assumed).",
        "<b>Exact cubic and quartic roots</b> — <code>x^3 = 2</code> → ∛2 and its complex pair; <code>x^3 - 3x + 1 = 0</code> → 2·cos(2π/9), 2·cos(4π/9), 2·cos(8π/9) (three real roots in trigonometric form, never a complex radical labelled real); quartics by Ferrari; repeated roots exact with their multiplicity; polynomials of higher degree factored over ℚ first; every closed form proved by an exact identity before it is shown, and degree ≥ 5 numeric with Abel–Ruffini said. <code>solve …</code> and <code>find the roots of …</code> are read as written.",
        "<b>Simplification, series and leftovers</b> — fractions in several variables cancel with the factor named; <code>taylor 1/(1+x^2)</code> states R = 1 from the poles ±i (a theorem, not a guess); <code>radius of convergence …</code>; ∫ 1/√(a² − x²) = asin(x/a) and ∫ 1/(x² + a²) = atan(x/a)/a exactly; proportion confidence intervals (Wilson, Clopper–Pearson, Wald with its truncation said); exact Markov hitting probabilities and first-passage times.",
        "<b>Abstract algebra</b> (Discrete kind) — ℤ/n, U(n), Sₙ in cycle notation, Dₙ (both naming conventions, the one read is said), direct products and typed Cayley tables (checked as a group by brute force); element orders, subgroups and the lattice drawn, cosets, normality, quotients, centre, conjugacy classes, isomorphism decided by two independent invariant sets where they prove it; permutations composed in either convention; arithmetic in ℤ/n; polynomials over 𝔽ₚ with irreducibility and factoring checked by multiplying back; GF(pᵏ) tables, primitive elements and minimal polynomials. Typed into the Equation kind it switches by itself.",
        "<b>Context-free grammars</b> (Discrete kind) — <code>S -&gt; aSb | ε</code> then <code>test: aabb ab aab</code> → S ⇒ aSb ⇒ aaSbb ⇒ aabb with the CYK table and the parse tree drawn, every verdict cross-checked by a brute-force derivation search; <code>is it ambiguous</code> → two parse trees for a witness string, both drawn (not found is evidence, never proof); nullable, FIRST and FOLLOW; useless symbols; left recursion removed; equivalence refused by name with a sample comparison.",
        "<b>Machines</b> (Discrete kind) — <code>pda</code> blocks with the acceptance mode always said, the configurations <code>(q0, aabb, Z) ⊢ …</code> and the stack drawn; <code>cfg to pda</code> checked against the grammar's CYK; <code>tm</code> blocks with the tape drawn, re-run by an independent second stepper; LOOPS only when a whole configuration repeats (a proof) and a 10,000-step cap reported as UNKNOWN; <code>tm binary increment 1011</code> → 1100; the halting problem refused by name; busy-beaver values cited, never computed.",
        "<b>First-order logic and SAT</b> (Discrete kind) — <code>prenex ∀x P(x) → ∃y Q(y)</code> → ∃x ∃y (P(x) → Q(y)); <code>skolemize</code>; <code>unify f(x, g(x)) and f(a, y)</code> → {x ↦ a, y ↦ g(a)} with the occurs check; <code>resolve … ⊢ …</code> → VALID with the refutation drawn, INVALID with a countermodel, or UNKNOWN within the cap; <code>dpll …</code> with the search tree, the model checked clause by clause or an unsat core with its resolution proof; <code>2sat</code> by strongly connected components; <code>horn</code>; DIMACS.",
        "<b>Hindley–Milner</b> (λ kind) — <code>hm let id = λx.x in (id 1, id true)</code> → int × bool with id : ∀α. α → α, Algorithm W step by step and the derivation tree drawn, cross-checked against the simple-type checker on the let-expanded term; λ-bound names are monomorphic and the refusal names the let fix.",
        "<b>λ-calculus</b> — the untyped λ-calculus, reduced <b>step by step</b>:each β-step names the redex it contracted, and a binder that would capture a free variable is <b>renamed first</b> as an α-step of its own (<code>(λx.λy.x) y</code> → <code>λy₁.y</code>, never λy.y). <b>Normal order</b> by default &mdash; the strategy that reaches a normal form whenever one exists &mdash; and <b>applicative order</b> by name, so the textbook separation is <i>shown</i>: <code>K I OMEGA</code> answers λx.x one way and <b>provably diverges</b> the other (the term cycles). Three outcomes and never a fourth: a normal form, a proven divergence, or a stated cap that is reported as a cap and not as a theorem, because normalisation is undecidable. Integers are Church numerals, the standard combinators and encodings are built in, and a numeral or boolean result is decoded <b>and re-computed by an independent environment-based evaluator</b> &mdash; two mechanisms, and they must agree. Plus the <b>principal simple type</b> by unification (λx.x x is not simply typable, and it says why), free variables, and α-equivalence by de Bruijn indices.",
        "<b>Discrete math</b> — twelve engines behind one kind, routed by what you type. <b>Number theory</b>, exact: gcd with Euclid's steps and Bézout coefficients, modular powers and inverses, linear congruences, the Chinese remainder theorem (moduli need not be coprime), factoring with an unsplit cofactor <i>named</i> as unsplit, primality by Miller–Rabin that is a <b>proof</b> below 3.3 × 10²⁴ and says “probable prime” above it, primitive roots, Jacobi symbols, modular square roots. <b>Combinatorics</b> with word problems whose model is named — and a sentence carrying a condition the formula ignores is refused, never answered with the unconditioned count. <b>Recurrences</b>: Fibonacci comes back as Binet's formula, <b>exact in ℚ(√5)</b>, every closed form verified against iteration; the master theorem with its regularity condition checked. <b>Propositional logic</b>: tables, normal forms, the Quine–McCluskey minimal form, equivalence, entailment with the counterexample row. <b>Automata</b>, drawn: DFA/NFA runs, regex → NFA → DFA → minimal DFA with the minimisation cross-checked on every short string, equivalence with the shortest distinguishing string. <b>Graphs</b>, drawn: Dijkstra and Bellman–Ford, Kruskal, Hierholzer, bipartite with the odd-cycle witness, topological order, Hamiltonian by exhaustive search to 16 vertices, and above that by certificate: a cycle found is a proof, a structural obstruction (cut vertex, degree-1 vertex, unbalanced bipartite sides, a removed set leaving too many pieces) is a proof of none, Dirac and Ore certify existence &mdash; and &ldquo;not found within the budget&rdquo; is stated to be no proof.",
        "<b>Symbolic differential equations</b> — y' = f(x), separable (<code>y' = 2y</code> → y = C·e²ˣ, the separation worked), linear first order via the <b>integrating factor</b>, and constant-coefficient second order via the characteristic equation (real, repeated or complex roots → cos/sin). Every solution is <b>verified by substituting back into the original equation</b>, the three-member solution family is <b>drawn</b>, and anything outside the four families is refused by name. (Numeric/stiff initial-value problems live in Analyze.)",
        "<b>Solve with units</b> — formula on the first line, knowns below: <code>F = m a</code> / <code>m = 3 kg</code> / <code>a = 2 m/s^2</code> → <b>F = 6 N</b> (kg·m/s²), the unit <b>derived</b> by dimensional arithmetic, never assumed. SI conversions reported (3 km → 3000 m), √ halves dimensions (a pendulum period comes out in seconds), and adding metres to metres-per-second is <b>refused naming the symbol at fault</b>.",
        "<b>Complex numbers</b> — <code>i</code> is the imaginary unit, and arithmetic over ℂ is <b>exact</b> on Gaussian rationals: <code>(2+3i)(1-i)</code> → <b>5 + i</b>, <code>(3+4i)/(1-2i)</code> → −1 + 2i, <code>(1+i)^8</code> → 16, <code>abs(3+4i)</code> → 5, <code>arg(1+i)</code> → π/4, <code>sqrt(-4)</code> → 2i, plus conj/re/im and a polar form. Every exact result is <b>cross-checked against floating-point evaluation of the original</b>; what cannot be exact (√(1+i)) is labelled NUMERIC. Equations in one unknown with complex coefficients are solved over ℂ — <code>z^2 = 2i</code> → 1 + i and −1 − i, <code>z^3 = i</code> → three roots — and <b>every root is substituted back</b>.",
        "<b>Partial fractions</b> — <code>partial fractions 1/(x^2-1)</code> → 1/2/(x − 1) − 1/2/(x + 1); <code>1/(x*(x+1)^2)</code> gives the repeated factor both powers, an improper fraction states its polynomial part first, and quadratic factors over ℚ — repeated or distinct, <code>1/(x^4+4)</code> included — keep linear numerators. The decomposition is <b>recombined exactly</b> to confirm it equals the original; a factor that is irreducible over ℚ is refused by name.",
        "<b>Parametric systems</b> — one extra letter in a linear system is a parameter: <code>a x + y = 1</code> / <code>x − y = 2</code> → x = 3/(a + 1), y = (−2a + 1)/(a + 1) <b>for every a ≠ −1</b>, and the <b>special values</b> listed and classified from the original equations — a = −1 has no solution, the contradiction shown; where a value gives infinitely many, the free variable is named.",
        "<b>Whole-problem pastes</b> — paste an entire SAT-style question (equation, prose, answer choices): the equation is found, the prose ignored (and the note says so), fractions clear with the multiply-through worked (<code>3/(x+3) = 8</code> → x = −21/8 with x ≠ −3 stated), and rendered stacked fractions copied as separate lines reassemble.",
        "<b>Word problem</b> — offline templates for percentages, distance = rate × time, work rates, proportions, running totals, and simple “a number …” sentences translated to an equation and solved. <b>Rate-interpretation questions</b> (the SAT Celsius/Fahrenheit type) get both exchange rates EXACTLY (dC/dF = 5/9, dF/dC = 9/5) and every answer choice judged <b>TRUE or FALSE with the arithmetic shown</b> — increase vs decrease honored, unjudgeable statements disclosed, nonlinear relations refused by name.",
        "Type <code>^</code> for powers (<code>x^2</code>); pasted superscripts (<code>x²</code>) work too. Exact results are labelled exact; numeric ones state their limits, and it says so rather than inventing an answer it can’t parse.",
        "<b>Two-body problems</b> \u2014 distance/rate/time where things approach or separate, with the combined rate shown in the working. Anything the templates cannot represent is refused rather than answered from whichever number appeared first.",
      ],
      examples:[
        {in:"x^2 - 5x + 6 = 0", out:"x = 3, 2 (exact, quadratic)"},
        {in:"x^2 + 1 = 0", out:"0 + 1i, 0 − 1i (complex pair, flagged)"},
        {in:"F = m*a, solve for a", out:"a = F/m — requires m ≠ 0"},
        {in:"differentiate sin(x)*cos(x)", out:"cos(x)^2 - sin(x)^2"},
        {in:"differentiate sin(x^2)", out:"2*x*cos(x^2)"},
        {in:"∫ x^2 from 0 to 3", out:"9 — exact (symbolic), F(x) = x^3/3"},
        {in:"12 is what percent of 48?", out:"25%"},
        {in:"serre s2 s1", out:"the E₂ page, with the one possible d₂ marked UNDETERMINED — no H*(E) claimed"},
        {in:"stable pi_3", out:"π₃ˢ = Z/24 — labelled a LOOKUP from a published table, not a computation"},
        {in:"alexander trefoil", out:"Δ(t) = 1 − t + t², determinant 3, symmetry Δ(t) = Δ(1/t) checked"},
        {note:"An analysis aid — verify before relying."}
      ] },
    cad: { title:"Drawing (CAD)", tagline:"Build a part from shapes, sketch it, or import it from your CAD package (STEP, IGES, STL, OBJ, DXF); combine parts, turn them in 3D, and insert an engineering or patent drawing with every hidden line worked out on your machine.",
      does:[
        "<b>Parts</b> in drafting dimensions — diameters, not radii: block, cylinder / pin, tube / bushing, cone, sphere, plate with a hole grid, L-bracket, stepped shaft, flange with a bolt circle. An impossible part (holes through an edge, a bore wider than the flange) is refused with the reason, never drawn wrong.",
        "<b>Sketch</b> your own parts: a box in five actions (Rectangle, width, Tab, height, click), grid snap, Smart Dimension, and Solid Edge's keys (S, L, R, C, A, P, T, D); extrude or revolve.",
        "<b>Import</b> from your CAD package: <b>STEP</b> and <b>IGES</b> parts and assemblies (every solid a part named from the file, the assembly kept in shape, the units the file's own; the model's own edges, so cylinders have no facet lines; tangent edges on or off), <b>STL</b> and <b>OBJ</b> meshes (you choose the units), and <b>DXF</b> drawings to insert or edit as a sketch. The STEP reader downloads once (3 MB) and then works offline. Native Solid Edge or SolidWorks files cannot be read — export them as STEP.",
        "<b>Combine</b> imported parts (STEP, STL, OBJ, or ones combined already): <b>Join to this</b>, <b>Cut out of this</b> or <b>Keep only the overlap with</b> another, by a mesh geometry engine (Manifold); the drawing keeps the recipe, so <b>Separate</b> puts them back.",
        "<b>Assemble</b> by moving and turning each part, or <b>mate faces</b>; <b>drag</b> to orbit the 3D view, wheel to zoom, click a part to edit it.",
        "<b>Views</b>: front, top, side, isometric, <b>section</b> (37 CFR 1.84(h)(3)), <b>detail</b> (2× to 10×), <b>exploded</b> and <b>perspective</b>; draw freehand, arrows, text and numerals anywhere on the sheet; sheets with title blocks and line types; export as SVG at true size, or to PowerPoint.",
        "<b>Hidden-line removal</b> on the true surfaces: curved parts get clean outlines, never facet lines, and a hidden line under a visible one is not drawn (ISO 128 / ASME precedence).",
        "<b>Standards</b>: ASME third-angle (default; 0.6 / 0.3 mm lines, 3 mm text, 6 mm view titles) or ISO first-angle (0.5 / 0.25 mm, 2.5 mm text), each at a standard ISO 5455 scale with the projection symbol; USPTO 1.84 sheets with FIG. labels in reading order and numerals at least 3.2 mm on lead lines; journal and plain line art.",
        "<b>Callouts</b> anchor to a point on the part — a balloon (engineering) or a reference numeral continuing your Numerals table (patent) — and appear in every view where that point is visible, set in tidy columns beside the view.",
        "The model is stored in the inserted picture's alt text: select the drawing and <b>Edit drawing at cursor</b> reopens it."
      ],
      examples:[
        {in:"a plate with two holes, an L-bracket and a flange", out:"an ASME sheet: top above front, right side to its right, an isometric, SCALE 1:2"},
        {in:"an assembly exported as STEP: a base plate and two pins", out:"three parts named from the file, in place; a USPTO FIG. 1 with numerals 10, 12, 14 on lead lines"},
        {in:"a 20 mm cube, Cut out of this: a 10 mm rod through it", out:"one part with a bore — a circle in TOP, dashed hidden lines in FRONT and RIGHT SIDE"},
        {note:"It drafts from the parts you build or export; it is not a parametric modeller."}
      ] },
    seqmap: { title:"Sequence Map", tagline:"Open a GenBank / FASTA / SnapGene file and insert an annotated linear or circular map — read on your machine, nothing uploaded.",
      does:[
        "<b>GenBank</b> (.gb/.gbk/.gbff) draws a real map — it carries the feature annotations (promoters, CDS, resistance markers, origins) and topology, with the full location grammar (ranges, partial bounds, <code>complement</code>, <code>join</code>).",
        "<b>FASTA</b> gives the backbone and scale only — it has no features or topology, and the tool never guesses them.",
        "<b>SnapGene</b> (.dna) is read where possible; it falls back to “export as GenBank” with a message rather than a wrong sequence.",
        "Plasmids draw as <b>circular</b> maps, linear constructs as linear; <b>Auto</b> follows the record’s own topology. Joined CDS draw as segmented arrows; restriction sites can be overlaid; a black-and-white <b>patent-figure</b> style is available.",
        "Format is sniffed by content, not extension. Files are read locally as bytes — nothing is uploaded."
      ],

    align: { title:"Align", tagline:"Pairwise sequence alignment — global or local, with affine gaps — the algorithms EMBOSS needle and water run.",
      does:[
        "<b>Global (Needleman–Wunsch)</b> forces an end-to-end alignment — use it when the two sequences are the same thing (a clone vs its reference, two alleles).",
        "<b>Local (Smith–Waterman)</b> finds the best shared segment — use it when they share only a domain or differ a lot in length.",
        "<b>Affine gaps</b> (Gotoh), default gap open 10 / extend 0.5; <b>BLOSUM62</b> for protein or +5/−4 for DNA; sequence type auto-detects conservatively.",
        "Reports identities, similarities, gaps and 1-based spans; the ruler uses <code>|</code> (identical) and <code>:</code> (similar). Inserts in a monospace font so the columns line up.",
        "Percent identity is a fact about the <em>alignment</em>, not the sequences — it moves with the gap costs, and below ~25% (the twilight zone) unrelated proteins still align convincingly; the tool says so."
      ],
      examples:[
        {in:"two ~90%-identical proteins, global", out:"a full-length alignment, Identity 20/22 (90.9%)"},
        {note:"Paste plain sequence or FASTA; headers and whitespace are stripped."}
      ] }
  };

  const ORDER = ["analyze","engineering","chemical","massspec","charz","solidform","spectra","bioassay","peptide","stats","math","solve","units","plot","tablechart","finance","build","code","sequence","botanical","antibody","numerals","refs","citations","dna","seqmap","align","cad","reaction","audit","diagram"];

  const params = new URLSearchParams(location.search);
  const id = params.get("tool");
  const t = TOOLS[id];
  const titleEl = document.getElementById("title");
  const tagEl = document.getElementById("tagline");
  const content = document.getElementById("content");
  const nav = document.getElementById("nav");

  if (!t) {
    titleEl.textContent = "Tool not found";
    tagEl.textContent = "";
    content.innerHTML = '<div class="missing"><p>That tool isn’t recognized. <a href="index.html">See all 31 tools →</a></p></div>';
  } else {
    document.title = t.title + " — JurisLab";
    titleEl.textContent = t.title;
    tagEl.textContent = t.tagline;

    let html = "<section><h2>What it does</h2><ul class=\"does\">";
    for (const d of t.does) html += "<li>" + d + "</li>";
    html += "</ul></section>";

    html += "<section><h2>Examples</h2><div class=\"examples\">";
    for (const ex of t.examples) {
      html += '<div class="ex">';
      if (ex.in !== undefined) {
        html += '<div class="io"><span class="in"></span><span class="arrow">→</span><span class="out"></span></div>';
      }
      if (ex.note) html += '<div class="note">' + ex.note + "</div>";
      html += "</div>";
    }
    html += "</div></section>";

    html += '<section><div class="note-box"><strong>Private by design.</strong> This tool runs entirely on your machine — nothing you type leaves your computer. (The one exception across the whole add-in is the optional online name→structure lookup in Chemical mode, which prompts for consent before sending.)</div></section>';

    content.innerHTML = html;

    // Fill code text safely (textContent avoids any escaping surprises).
    const ios = content.querySelectorAll(".io");
    let k = 0;
    for (const ex of t.examples) {
      if (ex.in !== undefined) {
        const io = ios[k++];
        io.querySelector(".in").textContent = ex.in;
        io.querySelector(".out").innerHTML = ex.out; // out may contain <em> for names
      }
    }

    // prev / next
    const i = ORDER.indexOf(id);
    const prev = i > 0 ? ORDER[i - 1] : ORDER[ORDER.length - 1];
    const next = i < ORDER.length - 1 ? ORDER[i + 1] : ORDER[0];
    nav.innerHTML =
      '<a class="prev" href="tool.html?tool=' + prev + '"><small>← Previous</small>' + TOOLS[prev].title + "</a>" +
      '<a class="next" href="tool.html?tool=' + next + '"><small>Next →</small>' + TOOLS[next].title + "</a>";
  }
  </script>
</body>
</html>
