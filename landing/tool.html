  <script>
  // Each tool: icon, title, tagline, does[] (HTML bullets), examples[] ({in,out} or {note}).
  const TOOLS = {
    engineering: { title:"Engineering", tagline:"305 calculators across thirty-one disciplines &mdash; structural and solids, fatigue and machine design, reliability, fluids, thermal, energy and power, chemistry and electrochemistry, audio and acoustics, video and display, light and camera, colour and appearance, lighting and rendering, VFX and compositing, scene modelling and pipeline, electronics, chips and semiconductors, aviation and avionics, trajectory and orbits, spaceflight and missions, astronomy and lunar, robotics and kinematics, computation and information, control systems, vibration, optics and photonics, quantum optics, quantum computing, quantum mechanics, biomedical, molecular cloning, and pharmacokinetics &mdash; grouped as panels rather than buried in one dropdown, and computed exactly where exact is possible. The answers that are genuinely rational are reported as fractions rather than rounded.",
      does:[
        "<b>Structural &amp; solids (20)</b> &mdash; <b>tensile tests</b> (modulus, 0.2 % offset yield, UTS), <b>Weibull strength</b> and <b>Scherrer / Williamson&ndash;Hall crystallite size</b>; <b>plane frames</b> by direct stiffness and <b>a plate in plane stress</b> by finite elements; <b>beams</b>: reactions, shear force and bending moment diagrams, slope and deflection, from point, uniform and linearly varying loads and applied couples, with indeterminate spans on the same code path. Supports may be <b>rigid, elastic or settling</b> (<code>roller 8 k=5e4</code>, <code>roller 8 settle=0.01</code>) and the solve stays exact; those two cases need EI and say why, because a spring or a settlement makes the reactions genuinely depend on the beam's own stiffness. On a <i>determinate</i> beam neither changes any reaction &mdash; the beam simply moves &mdash; and the tool reports that rather than leaving you to wonder. Every number may be an exact <b>fraction</b> (<code>roller 8/3</code>, <code>point 30 at 8/3</code>), which matters when the engine computes over rationals and 2.6666666667 does not. <b>Cross-sections</b>: area, I, section modulus, radius of gyration and Q for rectangle, circle, pipe, box, I-beam and tee &mdash; and <i>both</i> section moduli when the section is not symmetric, because the fibre that yields first is the far one. <b>Stress states</b>: principal stresses, Mohr's circle, von Mises, Tresca and factor of safety, reporting the absolute maximum shear as well as the in-plane one. <b>Trusses</b> by the method of joints, solved exactly. <b>Column buckling</b> with the Johnson parabola. <b>Shaft torsion</b>, circular sections only. New in v2.191.0: <b>thermal stress</b> (restrained bars and plates, <b>bimetal / bilayer curvature</b> by Timoshenko, <b>Stoney thin-film stress</b>, thermal shock resistance); <b>thin-walled pressure vessels</b>, <b>Lam&eacute; thick-walled cylinders</b>, <b>shrink and press fits</b>, <b>rotating disks</b>, and <b>combined loading</b> with Mohr&rsquo;s circle and the beam-column amplification factor.",
        "<b>Fatigue &amp; machine design (8)</b> &mdash; <b>tolerance stack-up</b> by worst case and RSS; corrected endurance limit by the <b>Marin factors</b>, notch factor, <b>all four mean-stress criteria shown together</b> rather than one picked for you, finite life and Miner cumulative damage over a load spectrum. The <b>Langer yield check runs alongside every criterion</b>, because Goodman alone can pass a part that yields on its first cycle. The endurance limit <b>does not exist for non-ferrous alloys</b> and it says so instead of returning a false infinite life. Plus the DAMAGE-TOLERANCE half, which was absent entirely: <b>stress intensity and critical crack size</b>, because fracture is a THRESHOLD rather than a gradual degradation - K rises only as the square root of crack length, so a flaw safe at one stress is catastrophic at one modestly higher, without warning. <b>Paris-law crack growth</b> to failure, where most of the life is spent while the crack is small and the final doubling takes almost no cycles, so an inspection interval set from the total life is worthless. And the <b>yielding-or-fracture transition</b>, the single number that decides which calculation is even relevant. K_IC, the geometry factor and the Paris constants are all YOUR inputs, and the tool refuses when the plastic zone is too large for linear elastic fracture mechanics to apply at all. New: <b>Hertz contact stress</b> for spheres, cylinders and crossed cylinders, with the subsurface depth of the maximum shear.",
        "<b>Reliability (6)</b> &mdash; <b>process capability</b> (Cp, Cpk, Pp, Ppk); <b>Weibull life fitted by MAXIMUM LIKELIHOOD</b> from your own test data, not by regression on a probability plot, and units still running are entered as suspensions and used IN the fit - discarding survivors biases the fitted life short. <b>The shape parameter is the answer, not the mean life</b>: below 1 the parts are dying young and burn-in helps, above 1 they are wearing out and scheduled replacement helps, at 1 neither does anything at all. The regime is read from a <b>likelihood-ratio confidence interval</b> rather than from the point estimate, so an interval that straddles 1 is reported as a constant hazard rather than as wear-out, however far above 1 the point estimate sits. <b>Series and parallel block diagrams</b> that name the component carrying most of the failure rate, because improving anything else is wasted effort until that one moves. <b>k-out-of-n</b> for voting logic and pump trains, where requiring all n is a series system wearing redundant clothing and is WORSE than one unit. <b>Active against standby spares</b>, which states the two assumptions doing all the work - a spare that does not age while it waits and a switch that never fails - and notes that a switch with its own failure rate can make standby worse than active. And <b>availability</b>, labelled INHERENT: it counts the repair itself and not the wait for a spare, a technician or a maintenance window, so the operational figure is always lower. Every failure rate, MTBF and MTTR is YOUR input. There is <b>no built-in failure-rate handbook</b> and there will not be one, because a failure rate is a property of a part in a duty cycle in an environment.",
        "<b>Fluids (12)</b> &mdash; <b>pipe flow</b> with Colebrook-White <i>solved</i> rather than approximated, and the regime stated honestly. <b>Open-channel flow</b> by Manning with the Froude regime and a hydraulic-jump warning. <b>Pump NPSH</b> and cavitation margin. <b>Compressible flow</b> with the choking condition. <b>Differential-pressure metering</b> (orifice, venturi, nozzle) where the PERMANENT loss is not the differential the meter reads: a venturi's diffuser recovers most of it and an orifice recovers almost none, which is the whole argument for paying for one. <b>Pump and system curves</b>, because a pump has no flow rate of its own - it has a curve, the system has another, and the machine runs where they cross. THROTTLING MOVES THE POINT UP THE PUMP CURVE: less flow at MORE head, with the difference burned across the valve. The <b>affinity laws</b>, where flow scales with speed, head with its square and POWER WITH ITS CUBE - the single exponent that justifies a variable-speed drive. And <b>drag on a body</b> with terminal velocity, where doubling the speed takes eight times the power. New: <b>gas dynamics</b> &mdash; normal shock, oblique shock with Prandtl&ndash;Meyer expansion (weak and strong branches named, detachment refused by name), Fanno and Rayleigh flow with choking.",
        "<b>Thermal (9)</b> &mdash; <b>composite walls and pipe insulation</b> as a resistance chain with every interface temperature, the controlling layer, and the <b>critical radius</b> below which adding insulation makes the heat loss worse. <b>Heat exchangers</b> by LMTD, counter or parallel flow. <b>Ideal-gas processes</b> (all five as one polytropic family). <b>Power cycles</b> &mdash; Otto, Diesel and Brayton, each checked against the Carnot bound between its own extremes. <b>Rankine and refrigeration</b>, which take enthalpies from your own tables: no steam tables are built in, deliberately, because a table reconstructed from memory would be unverifiable. <b>Exchanger RATING by effectiveness-NTU</b>, which answers the question LMTD structurally cannot: you have this exchanger and these two inlets, what comes out? LMTD needs the outlets to build the log mean, so it can only be iterated backwards. <b>Fin efficiency and effectiveness</b>, where an effectiveness BELOW 1 means the fin removes less heat than the bare surface would - adding metal adds area, which helps, and adds a conduction path, which does not. <b>Transient cooling</b> by lumped capacitance, which REFUSES above Biot 0.1 rather than caveating: past that the interior lags the surface and a single exponential is the wrong SHAPE of answer. <b>Radiation exchange and shields</b>, where temperature enters as the fourth power of an ABSOLUTE temperature and a shield works by adding surfaces rather than by insulating - which is why multilayer insulation is dozens of sheets of film. Emissivity is your measured input.",
        "<b>Chemistry &amp; electrochemistry (10)</b> &mdash; an <b>HPLC/GC peak table</b> (plate count, resolution, tailing, area % by USP &lang;621&rang;) with the chromatogram redrawn from it, a <b>TLC plate</b> figure, <b>exact titration curves</b> from the charge balance, speciation diagrams, solution and buffer pH, <b>cyclic voltammetry</b> by Randles&ndash;&Scaron;ev&ccaron;&iacute;k, and the Nernst, Butler&ndash;Volmer and Tafel tools.",
        "<b>Energy &amp; power (17)</b> &mdash; <b>wind turbine power</b> with the Betz limit ENFORCED: a claimed Cp above 16/27 is refused as physically impossible, the same way a claimed efficiency above Carnot is, because extracting all the kinetic power would stop the air dead behind the rotor. <b>Solar PV</b> with NOCT cell-temperature derating &mdash; a panel is rated at 25&nbsp;&deg;C cells, cells in sun run 20&ndash;30&nbsp;&deg;C above ambient, and crystalline silicon loses ~0.35&ndash;0.45% per &deg;C, so a &lsquo;400&nbsp;W&rsquo; panel on a warm roof is a ~350&nbsp;W panel and the tool says so. <b>PV fill factor</b> consistency checks from the four datasheet I-V points. <b>Hydropower</b> on the NET head, because gross head is geography and net head is what the turbine sees. <b>Battery packs</b> &mdash; series/parallel arithmetic, C-rate, runtime, and the <b>Peukert correction shown beside the uncorrected figure</b>, because the Ah rating is itself rate-dependent; a capacity typed in mAh just converts. <b>Combustion stoichiometry</b> computed exactly from the fuel's molecular formula via the real IUPAC atomic weights &mdash; methane AFR 17.1, octane 15.0, ethanol 9.0 &mdash; with LHV derived from your measured HHV through the latent heat of the combustion water, never predicted from a correlation. <b>Levelized cost of energy</b>, where the energy is discounted too &mdash; that is the algebra that makes LCOE the constant price which exactly repays the discounted costs. <b>Capacity factor</b>, where a value above 1 is refused with the arithmetic shown. Deliberately <b>no insolation, fuel or battery property tables</b>: those are measurements of your site, your fuel and your cell, and inventing them would be exactly the failure this product refuses elsewhere. And the v2.62.0 depth: <b>wind shear to hub height</b> by the power law AND the log law, both reported with their disagreement, because agreement is evidence and disagreement means the terrain is not textbook; <b>Weibull statistics</b> with the energy pattern factor (~1.9 at k = 2 &mdash; a site holds nearly twice the energy its mean speed suggests) and a capacity-factor estimate on the stated simplified power curve; <b>sun position, day length and H&#8320;</b> from pure astronomy, where polar day and night are answers rather than errors; <b>flue-gas analysis</b> &mdash; the analyser's dry O&#8322; reading inverted to excess air in closed form, on the SAME air convention as the combustion tool so the two cannot disagree; <b>off-grid storage sizing</b> with the loss chain compounded honestly, plus <b>LCOS</b> that says it excludes the charging energy rather than hiding it; <b>three-phase power</b> and <b>power factor correction</b> &mdash; the real power does not change, correction relieves the wires, and the delta bank needs one third the capacitance of the wye; and <b>cable voltage drop</b> with the &radic;3-vs-2 path factor stated, copper at the definitional 100% IACS, and AWG sizes computed from the gauge's exact geometric progression rather than tabulated. And <b>adiabatic flame temperature</b> &mdash; the classical no-dissociation figure, on GRI-Mech 3.0 NASA polynomials taken mechanically from the cited source and cross-checked against JANAF landmarks in the suite; near stoichiometric it overstates a real flame by ~100&ndash;200&nbsp;K and the result SAYS so. The heating value stays your measured input; sulfur fuels are refused with the reason rather than answered with data the tables do not contain.",
        "<b>Audio &amp; acoustics (16)</b> &mdash; sampling and aliasing, quantisation (SNR exactly 20&middot;log&#8321;&#8320;2&middot;n + 10&middot;log&#8321;&#8320;1.5 dB, 98.0905 dB at 16 bits, assuming a full-scale signal), <b>decibels shown on BOTH bases</b> because the 10-versus-20 confusion silently doubles or halves every figure downstream, sound level with distance plus incoherent summing (two identical sources are +3 dB and ten are +10, not +6 and +60), <b>reverberation by Sabine AND Eyring</b> &mdash; Sabine never reaches zero however absorbent the surfaces, which is physically impossible, so the two are shown together and their divergence flagged &mdash; room modes classified axial, tangential and oblique since axial modes carry roughly twice the energy of tangential and four times that of oblique, and comb filtering, where a 1 ms delay notches at 500 Hz and every odd multiple and no amount of EQ fixes it because the cause is arrival TIME. New in v2.140.0: <b>levels &amp; references</b> on a level ladder (+4 dBu = &minus;14 dBFS under EBU R68; a decibel is never a unit), <b>level arithmetic &amp; weighting</b> (80, 80, 74 &rarr; 83.5241 dB; octave bands at 80 dB &rarr; 86.974 dB(A)), <b>dither</b>, <b>file size</b> with the WAV ceiling, <b>LUFS loudness</b> (&minus;16.3 &rarr; &minus;23 LUFS is &minus;6.7 dB), <b>loudspeaker power</b>, an <b>absorption budget</b>, <b>passive crossovers</b> and <b>cable damping factor</b>. Absorption coefficients and Thiele-Small parameters are measured properties you supply; there is deliberately no built-in table.",
        "<b>Video &amp; display (12)</b> &mdash; bitrate budgets where <b>4:2:0 halves the data, not quarters it</b>, since it subsamples chroma on BOTH axes &mdash; the commonest arithmetic error in the subject; resolution and viewing geometry, where beyond a certain distance a finer panel changes nothing because <b>the eye is the limit</b>; HDR on the PQ curve, which is ABSOLUTE (a code value is a fixed number of nits, unlike gamma) and where a headline contrast figure is really a claim about the <b>black level</b>; PSNR, stated as comparable only within one piece of content at one resolution because squared pixel error is not what an eye responds to; streaming buffers, which trade latency for robustness one-for-one and whose startup delay uses only the SURPLUS bandwidth; and latency budgets <b>quantised to the display refresh</b>, which is why shaving 5 ms off an encoder can deliver exactly nothing. New in v2.140.0: <b>SMPTE timecode</b> in exact rationals (00:10:00;00 at 29.97 DF is frame 17982; a label that does not exist is refused), <b>frame rates, pulldown &amp; shutter</b>, <b>aspect and pixel aspect</b> (720&times;480 at 4:3 is PAR 8:9), <b>transfer functions</b> (BT.1886 at 0.5 &rarr; 18.94646 cd/m&sup2;) and the <b>SDI link rate</b> with blanking (1080p60 4:2:2 10-bit: 2.97 Gbit/s, not the 2.48832 Gbit/s of active picture). Compression ratios are your input; there is deliberately no codec-efficiency table, no codec implementation and no VMAF-style trained metric.",
        "<b>Light &amp; camera (3)</b> &mdash; <b>illuminance, luminance &amp; beams</b> (1000 cd at 2 m = 250 lx; a uniform 30&deg; cone = 214.0943 lm, the honest route round the refused cd &rarr; lm; 5000 lm on 10 m&sup2; = 159.1549 cd/m&sup2; = 46.4515 ftL), <b>exposure, f-stops &amp; depth of field</b> (f/8 at 1/125 s is EV 12.96578; 50 mm f/8 at 5 m is sharp from 3.38937 m to 9.52744 m) and <b>colour temperature &amp; mired</b> (3200 &rarr; 5600 K = &minus;133.9286 mired, a blue correction; CCT by McCamy beside Robertson).",
        "<b>Colour &amp; appearance (8)</b> &mdash; <b>colour difference</b> with &Delta;E*ab, &Delta;E*94, &Delta;E CMC and &Delta;E<sub>00</sub> side by side and a <b>claim-ready line</b> naming the formula, illuminant/observer and geometry (a red standard 45, 52, 28 against 46.2, 49.5, 30.1: &Delta;E<sub>00</sub> 2.15 but &Delta;E*ab 3.48, so &ldquo;&Delta;E &lt; 2&rdquo; is ambiguous until it names its formula), <b>batch QC</b>, <b>conversion</b> between XYZ, xyY, L*a*b*, L*C*h, L*u*v*, u&prime;v&prime; and sRGB/hex, <b>chromatic adaptation</b> (Bradford, von Kries, CAT02, CAT16), <b>spectral reflectance to colour</b> by ASTM E308 with the dominant wavelength, the <b>metamerism index</b>, <b>whiteness and yellowness</b> (CIE W and T, ASTM E313) and <b>WCAG contrast</b> (#777777 on white is 4.48:1, which fails AA for normal text).",
        "<b>Lighting &amp; rendering (7)</b> &mdash; <b>sun position, golden hour &amp; shadows</b> within 0.007&deg; of NREL SPA (London, 21 June 2026, 15:00 BST: 53.99&deg; up, azimuth 230.0&deg;, a 1.8 m post casts 1.308 m of shadow), <b>soft shadows</b> (umbra, penumbra D&middot;d/L, antumbra, contact hardening), <b>falloff, ratios &amp; light units</b> (2 m &rarr; 4 m is 2 stops; a disc light as a point is 1 % high at five diameters), the <b>GGX microfacet BRDF</b> with a white-furnace test, <b>render noise</b> (halving noise takes 4&times; the samples), <b>tone mapping</b> (Reinhard, Hable, the ACES fit) and <b>atmosphere &amp; fog</b> (Beer&ndash;Lambert, Koschmieder, Rayleigh, air mass, Henyey&ndash;Greenstein).",
        "<b>VFX &amp; compositing (11)</b> &mdash; <b>retime &amp; speed ramp</b> (a 48-frame shot at 40&nbsp;% runs 120 frames, 94 between source frames; 180&deg; blur reads as 450&deg;), <b>frame range, handles, padding &amp; audio sync</b> (1602, 1601, 1602, 1601, 1602 samples at 29.97 / 48&nbsp;kHz), <b>camera match</b> (ARRI sensor modes, anamorphic, Maya apertures, film fit), <b>projection &amp; parallax</b>, <b>3D transforms</b> with rotation order and pivot, <b>normal maps &amp; shading</b>, <b>camera log &harr; linear</b> (LogC3, LogC4, S-Log3, V-Log, Log3G10, ACEScct/cc, Cineon), <b>Porter&ndash;Duff compositing</b> and blend modes, <b>chroma key</b>, <b>miniature &amp; sim scale</b> (Froude, CFL) and <b>rigid-body collision</b>.",
        "<b>Scene modelling &amp; pipeline (11)</b> &mdash; <b>Bézier</b> and <b>B-spline / NURBS curves</b> (a cubic through (0, 0), (1, 2), (3, 2), (4, 0) is 5.26837 long; the NURBS quarter circle with weights 1, &radic;2/2, 1 is exact to rounding), <b>mesh statistics</b> from OBJ (a torus reads &chi; = 0, genus 1; open, non-manifold and mis-wound edges named), <b>Catmull&ndash;Clark and Loop budgets</b> (a cube goes 6 &rarr; 24 &rarr; 96 quads), <b>LOD switch distances</b>, <b>ray intersection and the SAH</b>, <b>texture memory</b> (2048&sup2; BC7 with mips = 5,592,432 bytes), <b>render farm</b>, <b>frame storage</b> and <b>pipeline throughput</b> (Little's law).",
        "<b>Trajectory &amp; orbits (13)</b> &mdash; <b>projectile motion</b> in a vacuum, where <b>45&deg; is optimal only when launch and landing heights match</b>: throw from a height and the best angle is lower, because the drop buys flight time for free. The same shot <b>with air drag</b>, integrated numerically with a terminal event so it stops exactly at ground contact &mdash; and it shows that <b>drag is not a correction but the dominant term</b>, a bullet flying a small fraction of its vacuum range. The <b>inverse problem</b> returns BOTH the flat and the lofted angle, and REFUSES a target beyond maximum range rather than clamping to 45&deg;. <b>Impact energy SATURATES</b>: the object reaches terminal speed, so a hailstone falling five kilometres hits no harder than one falling two hundred metres. <b>Circular orbits</b>, where a lower orbit is a FASTER one. <b>Elliptical orbits</b> by vis-viva, where the period depends ONLY on the semi-major axis and not at all on eccentricity. The <b>Hohmann transfer</b>, carrying the best result in the subject: <b>to catch something ahead of you in the same orbit, you must slow down</b>. The <b>rocket equation</b>, where &Delta;v is EXPONENTIAL in mass ratio so the last increment costs by far the most &mdash; the reason staging exists. <b>Escape speed</b>, independent of direction and exactly &radic;2 times circular. <b>Jerk-limited S-curve profiles</b>, slower on purpose because a trapezoidal profile's instantaneous acceleration step is a broadband impulse that rings every structural mode. <b>Multi-axis coordination</b>, where throttling the fast axes costs NOTHING in cycle time and is what makes the path straight rather than a dog-leg. <b>Great-circle</b> distance and bearing, where the initial bearing is not the final one. And the <b>wind triangle</b>, which refuses when no heading makes the track good. Gravitational parameters are IAU 2009 values extracted from a published source and cross-checked against the sidereal day; drag coefficients are your input. No 6-DOF simulation, no guidance laws, no perturbations.",
        "<b>Spaceflight &amp; missions (10)</b> &mdash; orbits from elements or a state vector with <b>Kepler propagation</b> for every conic (the parabola exactly); <b>Lambert</b> transfers; <b>interplanetary</b> Hohmann, C3, launch windows and a <b>porkchop</b> from JPL&rsquo;s approximate planet elements; a <b>lunar &Delta;v budget</b>; plane changes, bi-elliptic and phasing; <b>J2</b>, sun-synchronous and repeat ground tracks, GEO drift; <b>Lagrange points</b> with zero-velocity curves, Hill sphere and Roche limit; <b>re-entry</b> and orbital decay; ground-station look angles, coverage and Doppler; spacecraft thermal balance. Two-body and patched conics, and every result says so.",
        "<b>Astronomy &amp; lunar (10)</b> &mdash; <b>time scales</b> (Julian Date, UTC/TAI/TT with the leap-second table and its expiry, ΔT, sidereal time; the 1582 reform and negative years handled), <b>celestial coordinates</b> (RA/Dec to altitude/azimuth with refraction and airmass, ecliptic, galactic, precession, separation), <b>the Moon</b> (phase, illuminated fraction, age, rise/transit/set, the next phases, libration, the lit disc drawn as seen), a <b>Moon calendar</b> with perigee, supermoons and lunar and solar eclipses, the <b>Sun, Moon and planets</b> (positions, magnitudes, rise and set), <b>telescopes and cameras</b>, <b>stars</b> (distance modulus, parallax, luminosity, Wien), <b>redshift</b> (Hubble law and flat ΛCDM distances), <b>Kepler and exoplanets</b> (transit depth and duration, radial velocity) and <b>surface gravity, tides and day length</b> on the planets and major moons. Offline, from Meeus's lunar theory and truncated VSOP87, measured against JPL DE421: the Moon within 17″, the planets within 4″, rise and set within seconds.",
        "<b>Electronics (12)</b> &mdash; <b>transient response</b> of the same netlist with PULSE, SIN and PWL sources; <b>DC operating point</b> by modified nodal analysis, exact over rationals, accepting values written the way a schematic prints them (2k2, 4R7). <b>AC response</b> as phasors at a frequency or a swept <b>Bode plot</b>. <b>Op-amp circuits</b> with the real limits the ideal model hides &mdash; gain-bandwidth, slew rate, the integrator that saturates without DC feedback. <b>Analogue filter design</b> (Butterworth and Chebyshev) that computes the minimum order from a specification and hands the result to the control tools as a transfer function. <b>Truth tables with Quine-McCluskey minimisation</b>, which does not run out at five variables the way a Karnaugh map does. New: <b>controlled sources and coupled inductors</b> (E, G, H, F, K) in the circuit simulator for DC, AC and transient; an <b>RF link budget</b>, a <b>noise-figure cascade</b> by Friis with receiver sensitivity, <b>Eb/N&#8320; &harr; BER</b>; <b>transmission lines with the Smith chart</b>, quarter-wave and single-stub matching, and <b>two-port S-parameters</b> with stability.",
        "<b>Control systems (8)</b> &mdash; <b>root locus</b>, <b>Nyquist</b> with encirclements checked against the closed-loop poles, <b>lead/lag design</b> and <b>discrete time</b>; transfer functions with the <b>exact Routh-Hurwitz array</b>, and <b>stability decided twice</b>: exactly by Routh and numerically from the poles. When the two disagree it reports both and chooses neither, because that means a pole is too close to the axis to trust. <b>Step and impulse response</b> with damping ratio, overshoot and settling time. <b>Frequency response with gain and phase margins</b>, where a margin that does not exist is reported as not existing. <b>PID with the loop closed</b>. A right-half-plane zero is named as non-minimum-phase.",
        "<b>Vibration (7)</b> &mdash; free response with logarithmic decrement, forced response and isolation, and multi-degree-of-freedom natural frequencies and mode shapes via a symmetric generalised eigenproblem, so the frequencies are guaranteed real. <b>Multi-DOF forced response</b> by modal superposition gives amplitude and phase at every degree of freedom plus the modal breakdown, so you can see which mode is carrying the load: <b>every</b> natural frequency is a resonance, not just the first, and a force applied at a <b>node</b> of a mode cannot excite it at all. Damping is entered as modal ratios or a Rayleigh pair, because the method assumes <b>classical damping</b> &mdash; which a single discrete damper between two floors does not satisfy &mdash; and it states that rather than assuming it of a matrix you supplied. Built around the three results most often got wrong: <b>resonance is not at r = 1</b>, <b>isolation only begins above r = &radic;2</b> (below it a mount amplifies), and <b>damping helps below &radic;2 and hurts above it</b>. New: <b>random vibration</b> (PSD profiles, Grms, Miles&rsquo; equation), <b>base excitation</b> and isolator transmissibility, and <b>shaft critical speeds</b> (Rayleigh and Dunkerley).",
        "<b>Chips &amp; semiconductors (7)</b> &mdash; <b>switching and leakage power</b> (P = &alpha;CV&sup2;f, with the activity factor defined as 0&rarr;1 transitions per CYCLE, because the other convention in circulation halves the formula and doubles alpha), <b>junction temperature</b> through the series thermal path with every interface temperature and the power that would reach the limit, <b>interconnect RC delay</b> reporting the Elmore upper bound and the 50% crossing SEPARATELY (0.5&middot;RC against 0.38&middot;RC &mdash; Elmore is about 30% pessimistic and quoting one as the other is a silent error in a timing budget), and <b>setup/hold closure</b>, where clock skew enters the two checks with OPPOSITE signs. Leakage is a measured input rather than a prediction: it is exponential in temperature and specific to the process. New: <b>semiconductor devices</b> &mdash; the pn junction (built-in potential, depletion width, C&ndash;V, diode current), the MOSFET square law, and carrier statistics with the Fermi level (Si n&#7522; 9.65&times;10&#8313; cm&#8315;&sup3;, Altermatt et al. 2003); degenerate doping is flagged rather than computed wrongly.",
        "<b>Computation &amp; information (9)</b> &mdash; <b>parallel speedup by BOTH Amdahl and Gustafson</b>, because either alone answers half the question: Amdahl holds the problem fixed and asks how much sooner it finishes, Gustafson holds the time fixed and asks how much more work fits, and their parallel fractions are fractions of different totals; <b>Shannon entropy</b> and redundancy, where a zero-probability symbol contributes zero by the limit p&middot;log&nbsp;p &rarr; 0 rather than a NaN that would poison the sum; <b>channel capacity</b>, Shannon-Hartley and the binary symmetric channel, with SNR read as 10&middot;log&#8321;&#8320; of a POWER ratio (the 20&middot;log form is for amplitudes and would badly overstate it); the <b>birthday bound</b>, reporting the collision PROBABILITY and the expected number of colliding pairs separately, because the second exceeds 1 long before the first does and quoting one as the other is the commonest error here; <b>floating-point precision</b>, where machine epsilon is the spacing at 1.0 and NOT an absolute error bound, with catastrophic cancellation quantified in digits lost; and <b>empirical runtime scaling</b>, which fits a power law and says so &mdash; two points cannot separate n&middot;log&nbsp;n from n^1.1 and cannot see an exponential at all. New: <b>AI compute</b> &mdash; the roofline (ridge point, memory- or compute-bound), transformer size (parameters, FLOPs per token, weight and KV-cache memory) and low-precision <b>number formats</b> (fp16, bf16, fp8 E4M3/E5M2, int8/int4) with exact rounding.",
        "<b>Robotics &amp; kinematics (7)</b> &mdash; planar chain <b>forward kinematics</b>; <b>2R inverse kinematics that returns BOTH branches</b>, always, named by the sign of &theta;&#8322; rather than &lsquo;elbow up/down&rsquo; (those labels flip with the base frame and are not a specification) &mdash; a target outside the annulus |L1&minus;L2| &le; r &le; L1+L2 is <b>refused rather than clamped</b>, and at full extension or fold the two branches coincide and the arm is <b>singular</b>; the <b>Jacobian</b> with its determinant, manipulability, singular values and condition number, where det J = L1&middot;L2&middot;sin&theta;&#8322; depends only on the elbow so no shoulder angle can rescue a singularity, plus static joint torques from a tip load by <b>J transpose</b>; <b>Denavit-Hartenberg</b> forward kinematics in the STANDARD convention, stated because the modified/Craig convention gives a different pose from the same table, and with <b>gimbal lock reported rather than an arbitrary roll/yaw split invented</b>; <b>trapezoidal motion profiles</b> that fall back to triangular when the move is too short to reach the commanded speed; and <b>differential-drive</b> kinematics in both directions, where equal wheels mean an INFINITE turn radius, not zero. New: <b>attitude conversions</b> &mdash; quaternions, rotation matrices, all twelve Euler sequences, gimbal lock named, and slerp.",
        "<b>Aviation &amp; avionics (7)</b> &mdash; the <b>ICAO/US-1976 standard atmosphere</b> walked layer by layer to 84.852 km, because the barometric relation is a power law where the lapse rate is non-zero and an exponential where it is zero, and one formula applied across a boundary is a plausible wrong number; the <b>airspeed chain</b> TAS/EAS/CAS/Mach, where CAS is derived through the IMPACT PRESSURE rather than from EAS by a density correction (the compressibility term does not cancel); the <b>drag polar</b> with best L/D derived from the polar rather than searched, so the two cannot disagree; <b>level-turn</b> load factor and radius, where stall speed rises with &radic;n and not with n &mdash; 60&deg; of bank is 2 g and a 41% higher stall, not 100%; and <b>climb and glide</b> from the exact arcsine of (T&minus;D)/W rather than the small-angle shortcut. The base pressures of the atmosphere are GENERATED from the recurrence rather than typed, so the profile is continuous by construction. <b>IAS is not computed</b>: CAS&rarr;IAS is instrument and position error, a property of the airframe. New: the <b>Kalman filter</b>, in steady state (Riccati solution) and run on your measured data with the innovation check.",
        "<b>Optics &amp; photonics (17)</b> &mdash; <b>liquid-crystal retarders and achromatic wave plates</b> (spectra, achromatic band, tilt design, measured overlay) and the <b>Fr&eacute;edericksz transition</b> (director profile, retardance vs voltage), with cell and device drawings; <b>Fresnel s/p</b>, <b>thin-film stacks</b> and <b>Jones calculus</b>; <b>Gaussian beams</b> (Rayleigh range, divergence, M&sup2;, waist propagation), <b>ABCD ray matrices</b> for a whole system with the beam traced through it, <b>two-mirror cavity stability</b> and mode size, <b>pulse energy, peak power and fluence</b>, refraction with total internal reflection and Brewster, the <b>Airy disc and grating orders</b>, and <b>step-index fibre</b> NA, V-number and cutoff. The factor-of-two traps are named in every result: w is a 1/e&sup2; RADIUS, divergence is a HALF-angle, peak fluence is twice the energy over the 1/e&sup2; area, and a Gaussian pulse peaks at 0.939 E/&tau; rather than E/&tau;. There is deliberately <b>no refractive-index table</b> &mdash; n is dispersive and a table recalled rather than cited would be unverifiable, so you supply it. New: <b>laser physics</b> &mdash; the Fabry&ndash;P&eacute;rot cavity (FSR, finesse, photon lifetime, Q), threshold and slope efficiency, coherence and the Schawlow&ndash;Townes linewidth, and second-harmonic generation with quasi-phase matching.",
        "<b>Quantum optics (11)</b> &mdash; entanglement of a <b>two-qubit state</b> (concurrence, entanglement entropy, Schmidt spectrum) where the PHASE decides the answer, a <b>CHSH Bell test</b> that checks the classical bound of 2 and also Tsirelson&rsquo;s 2&radic;2 &mdash; a value above the latter is flagged as an error rather than a stronger result &mdash; the <b>Werner state</b>, which is entangled above p = 1/3 but cannot violate CHSH until p = 0.707, and the <b>BB84 secure key rate</b>, whose famous 11% threshold is computed as the root of the rate formula rather than typed in beside it. New: <b>linear optics</b> &mdash; beam splitters and Mach&ndash;Zehnder fringes, Hong&ndash;Ou&ndash;Mandel interference, multiphoton (boson-sampling) probabilities by permanents, dual-rail qubits and the linear-optics CZ gates; and <b>space quantum links</b> &mdash; a free-space single-photon link to LEO, GEO or the Moon, entanglement distribution with coincidences and Bell visibility, and the BB84 key rate over that link.",
        "<b>Quantum computing (14)</b> &mdash; <b>Dirac notation</b> &mdash; states, inner products and the <b>Born rule</b>; operators (Hermitian and unitary checks, spectra, commutators, the uncertainty relation); <b>single-qubit gates on the Bloch sphere</b>; a <b>circuit simulator</b> up to 10 qubits that draws the circuit; superposition and interference, <b>Bell states</b>, <b>teleportation</b>, superdense coding, <b>Deutsch&ndash;Jozsa</b>, <b>Grover</b> and the <b>quantum Fourier transform</b>; density matrices (purity, entropy, fidelity) and two-party entanglement (Schmidt decomposition, concurrence, negativity). Amplitudes are shown exactly where they are exact (1/&radic;2, not 0.7071).",
        "<b>Quantum mechanics (5)</b> &mdash; the <b>particle in a box</b> (infinite and finite wells), the <b>quantum harmonic oscillator</b>, the <b>hydrogen-like atom</b> (levels, transitions, radial probability), <b>tunnelling</b> through a rectangular barrier, and <b>two-level dynamics</b> (Rabi oscillation, spin precession). Constants are CODATA 2018 exact values.",
        "<b>Biomedical (5)</b> &mdash; <b>BMI and body surface area</b> by four published formulas side by side, and <b>lab unit conversions</b> (mg/dL ↔ µmol/L or mmol/L) that refuse a value typed in the other unit. <b>haemodynamics</b> (Poiseuille flow, wall shear stress, systemic vascular resistance), where the fourth-power dependence on radius means a 20% narrowing more than doubles the resistance. <b>Joint biomechanics</b> including the <b>joint reaction force</b> that is usually left out, and which is larger than either the muscle force or the load. <b>Signal sampling and aliasing</b>, because aliasing is the one failure here that cannot be undone afterwards.",
        "<b>Molecular cloning (4)</b> &mdash; a schematic <b>agarose gel</b> against NEB or Thermo ladders, <b>Golden Gate</b> and <b>Gibson / HiFi</b> assembly design, and <b>PCR primer design</b>, every Tm from the one nearest-neighbour model.",
        "<b>Pharmacokinetics (9)</b> &mdash; <b>dosing weights</b> (ideal, adjusted, lean), <b>Cockcroft–Gault</b> clearance with the weight used stated, <b>CKD-EPI 2021</b> eGFR (creatinine, and with cystatin C), weight- and BSA-based <b>dose</b>, and <b>infusion rate</b> in mL/h; each cites its source paper and is for research and education. <b>Arrhenius shelf life</b> from stability data; IV bolus, infusion and oral <b>dose and concentration curves</b>, built on clearance and volume because those are the physiologically independent parameters and half-life is a consequence of both. <b>Steady state</b> with accumulation and loading dose, where the average depends only on dose rate and clearance while the time to get there depends only on half-life. <b>Non-compartmental analysis</b> of measured data, with the terminal window chosen by best adjusted R&sup2; and the <b>% of AUC from extrapolation</b> reported. <b>Flip-flop kinetics are detected</b> &mdash; if absorption is slower than elimination the terminal slope is absorption, not elimination, and the curve looks normal either way.",
        "<b>Every calculator inserts a figure with its data.</b> All 305 draw the conventional construction for their result &mdash; Mohr&rsquo;s circle, the Goodman diagram, a P&ndash;v cycle, the drag polar, an S&ndash;N curve, the fold diagram, orbits and transfers to scale. Where the angle or the area IS the claim, the figure keeps equal scale on both axes; every curve comes from the same engine as the numbers beside it, so the two cannot disagree, and legends sit outside the plot frame so nothing covers the data.",
        "<b>Exact where exact is possible.</b> Beams, trusses and DC circuits compute over rationals rather than floats, so a propped cantilever reports 3/8 wL and not 0.37499999996, a zero-force member is an exact zero rather than something under a tolerance, and a divider reports 10/3 V rather than 3.3333. <b>Statically indeterminate beams are the same code path</b> &mdash; compatibility is solved alongside equilibrium, with no force method and no superposition table.",
        "<b>Units are converted, and the conversion is reported.</b> A bare number is read in the unit the field names and flagged as assumed; write another unit (200 GPa, 1e6 mm^4, 50 ksi, 68 &deg;F) and it is converted <i>and told to you</i>; a unit of the wrong quantity is refused by name rather than silently dropped. This closed a live trap: cross-sections report I in mm&#8308; because that is what section tables print, buckling wants m&#8308;, and pasting one into the other was wrong by 10&#185;&sup2; while looking entirely plausible.",
        "<b>It refuses in the vocabulary of the subject, not the matrix.</b> A node with no DC path to ground is named as that, because it is the commonest netlist mistake. A mechanism, an indeterminate truss and a <b>critical form</b> &mdash; where the member count balances and the structure still collapses &mdash; are each named, which matters because counting members is exactly what cannot catch the third.",
      ],
      examples:[
        {in:"Beam: span 8, pin 0 / roller 8, udl 5 from 0 to 8", out:"R = 20 kN each &#183; M<sub>max</sub> = 40 kN&#183;m at mid-span"},
        {in:"Propped cantilever under a uniform load w", out:"R = 3/8 wL &mdash; <em>exact, not 0.37499999996</em>"},
        {in:"Stress state: &sigma;<sub>1</sub> = 100, &sigma;<sub>2</sub> = 60", out:"20 MPa in-plane max shear, <em>50 in truth</em>"},
        {note:"That second number is the one the bar yields at. For a biaxial state the zero out-of-plane principal stress lies outside the in-plane pair, so the in-plane circle understates the shear the material actually sees &mdash; which is why the absolute maximum is reported alongside it and the difference is called out."},
        {in:"DC divider, 2k2 and 4R7 written as a schematic prints them", out:"10/3 V &mdash; <em>exact over rationals</em>"},
        {in:"Pipe flow at Re 3200", out:"a number, <em>and a statement that it is not repeatable</em>"},
        {note:"The transition band from Re 2300 to 4000 has no trustworthy correlation, so saying so is the honest answer. Laminar flow uses 64/Re and reports that roughness was ignored, because a laminar flow cannot feel the wall. Colebrook-White is solved rather than approximated."},
        {in:"Pipe insulation below the critical radius k/h", out:"adding insulation <em>increases</em> the heat loss"},
        {in:"Fatigue: finite life from an S-N line", out:"a life reported as an order of magnitude"},
        {note:"Sut and Sy are asked for rather than looked up from an alloy designation, because they move by a factor of three with heat treatment. Identical specimens differ by a factor of three too, so a fatigue life quoted to three significant figures is the most confidently wrong number in mechanical engineering, and this says so with the answer."},
        {in:"Control: gain and phase margins of an open-loop L(s)", out:"a margin that does not exist is <em>reported as not existing</em>"},
        {note:"Stability is decided twice over &mdash; exactly by the Routh-Hurwitz array and numerically from the poles. When the two disagree the result says so and picks neither, because a disagreement means a pole sits too close to the imaginary axis for the numerical answer to be trusted. A right-half-plane zero is named as non-minimum-phase rather than left for you to notice."},
        {in:"Vibration: mount an instrument at a frequency ratio of 1.2", out:"the mount <em>amplifies</em> &mdash; isolation begins above &radic;2"},
        {note:"Three results in forced vibration are more often got wrong than right, so they are computed rather than assumed: resonance is not at r = 1 for a damped system, isolation only begins above r = &radic;2, and damping helps below &radic;2 while it hurts above it."},
        {in:"Thermal: a claimed efficiency, with temperatures typed in &deg;C", out:"converted to kelvin first, and the Carnot bound checked"},
        {note:"Every efficiency here is a ratio of ABSOLUTE temperatures, so a Celsius value used as kelvin does not give a slightly wrong answer &mdash; it turns a 62% bound into 96%. Rankine and refrigeration deliberately take enthalpies from your own tables rather than shipping steam tables, because a table reconstructed from memory would be unverifiable."},
        {in:"Logic: minimise a six-variable Boolean expression", out:"Quine-McCluskey &mdash; <em>a Karnaugh map runs out at five</em>"},
        {in:"PK: oral dose where absorption is slower than elimination", out:"flip-flop kinetics <em>detected and named</em>"},
        {note:"The terminal slope there is absorption, not elimination, and the concentration curve looks entirely normal either way &mdash; which is why it is called out rather than left in the number. Non-compartmental analysis also reports what percentage of the AUC came from extrapolation, because above about 20% the study simply did not follow the drug long enough."},
        {note:"<b>Honest limits.</b> Beams are Euler-Bernoulli (prismatic, linearly elastic, small-deflection, no shear deformation). Supports may be rigid, elastic or settling; the elastic and settling cases need EI and their reactions genuinely depend on it, which the tool checks by re-solving at a different EI rather than asserting. Trusses are pin-jointed, planar and determinate only &mdash; an indeterminate one is refused rather than guessed. Torsion covers circular shafts only, because Tr/J is a theorem for a circle and plainly false for a rectangle. Buckling uses the Johnson parabola rather than Euler alone, and is still the critical load of a <i>perfect</i> column. Circuits are linear and lumped: no diodes or transistors, no transient analysis, no mutual inductance or transmission lines. Control is linear, time-invariant and single-input single-output. Free vibration is single-degree-of-freedom; forced response is available for both single- and multi-degree-of-freedom systems, the multi-DOF case by modal superposition, which assumes classical (proportional) damping &mdash; a single discrete damper between two floors does not satisfy that and needs complex modes this does not do. Pharmacokinetics reports what fraction of the AUC was extrapolated, because above about 20% the study did not follow the drug long enough. There is no design code anywhere in this tool: it computes the mechanics, it does not tell you whether a member passes."},
      ] },
    analyze: { title:"Analyze", tagline:"A no-code numerical workbench inside Word — matrix math, optimization, signal processing, differential equations, and data insights, all computed offline from your own numbers.",
      does:[
        "<b>Linear algebra</b> — solve A·x = b, matrix inverse, determinant, rank &amp; trace, transpose, and multiplication, with partial pivoting for stability. Singular systems are reported honestly, never faked.",
        "<b>Eigenvalues</b> — for symmetric matrices (real values + eigenvectors) or <em>any</em> square matrix via the Francis double-shift QR algorithm, including complex-conjugate pairs shown as a ± bi.",
        "<b>QR and SVD</b> decompositions (Householder QR; one-sided Jacobi SVD, any shape).",
        "<b>Matrix expressions</b> — define named matrices and evaluate one line, e.g. A*inv(B) + 2*C', det(A), (A−B)^T.",
        "<b>Optimization</b> — minimize an objective you type (Nelder–Mead simplex); reports the optimum, minimum value, and convergence.",
        "<b>FFT / spectrum</b> — a sampled signal → amplitude spectrum, dominant frequencies, and a chart.",
        "<b>ODE / system solving</b> — y' = f(t, y) and coupled systems via an adaptive Dormand–Prince RK45 solver → a sampled table and a trajectory plot.",
        "<b>Boundary value problems</b> — y&Prime; = f(x, y, y&prime;) with y fixed at <i>both</i> ends, by finite differences or shooting. The honest part is what cannot be computed: an initial value problem has one solution, a <b>BVP may have none, one, or infinitely many</b> &mdash; y&Prime; + y = 0 on [0, &pi;] with both ends zero has infinitely many, and moving one endpoint to 1 leaves it with none. Both look like ordinary inputs, so every result says it reports ONE solution and cannot tell you which case you are in. It also solves on three grids and reports the <b>observed convergence order</b> as a self-check.",
        "<b>PDEs &mdash; heat, wave and Laplace/Poisson</b> by finite differences. <b>Stability is enforced, not hoped for:</b> explicit heat stepping is stable only for r = &alpha;&Delta;t/&Delta;x&sup2; &le; 1/2, and at r = 0.51 it does not degrade gently &mdash; it blows up to 1e300 within a few dozen steps from input that looks entirely reasonable. &Delta;t is reduced to satisfy the bound and the result <i>says</i> it was, or it refuses and names Crank&ndash;Nicolson, which has no such restriction. For the wave equation the Courant number must not exceed 1, and at exactly 1 the scheme is <b>exact</b> for the 1D wave equation.",
        "<b>Differential-algebraic systems</b> &mdash; y&prime; = f(t, y, z) with 0 = g(t, y, z), semi-explicit and <b>index 1 only</b>. The constraint is imposed at every step, so it holds by construction and never drifts. <b>Index &ge; 2 is refused by name:</b> the Cartesian pendulum is index 3 because its constraint never mentions the multiplier, and an index-1 method run on it can return a plausible pendulum that slides off its own constraint. Inconsistent initial values are projected onto the constraint and the result reports both the original residual and where it actually started.",
        "<b>Data → insights</b> — paste a table and get per-column summaries, a correlation matrix (Pearson r + p-value, Spearman ρ), trend detection, outlier/missing flags, and plain-language findings.",
        "Matrices insert as clean, editable <b>Word tables</b>; spectra and trajectories insert as charts."
      ],
      examples:[
        {in:"Solve A·x=b:  A = [[2,1],[1,-1]], b = [5,1]", out:"x = [2, 1]"},
        {in:"Eigenvalues of [[0,-1],[1,0]]", out:"±i (complex pair)"},
        {in:"Minimize (1-x)^2 + 100*(y-x^2)^2", out:"min ≈ 0 at x=1, y=1"},
        {in:"BVP:  y'' = -y  on [0, π/2],  y = 0, 1", out:"sin x — <em>observed convergence order 2.00</em>, error estimate 9.0e−6"},
        {note:"The same BVP on [0, π] with y = 0, 0 has infinitely many solutions, and with y = 0, 1 it has none. Both are ordinary-looking inputs, so every result says it reports ONE solution and cannot tell you which case you are in."},
        {in:"Heat:  u_t = u_xx,  u(x,0) = sin(pi*x),  t = 0.1", out:"peak decays 1.0000 → 0.3729; both ends held at 0"},
        {in:"Heat, explicit FTCS with too large a Δt", out:"Δt <em>reduced</em> to satisfy r ≤ ½, and the result says so"},
        {in:"Wave:  u_tt = u_xx,  same start,  t = 1", out:"amplitude 1.0000 → 1.0000 — a wave does not decay, unlike heat"},
        {in:"DAE:  y' = -z,  0 = z - y,  y = 1, z = 1", out:"y = e⁻ᵗ, with z tracking y to machine precision at every step"},
        {in:"DAE with an inconsistent start (z = 5)", out:"says the values were INCONSISTENT, reports |g| = 4, and starts from the projected point"},
        {note:"The Cartesian pendulum — x'=u, y'=v, u'=−λx, v'=−λy−g, 0 = x²+y²−L² — is REFUSED: ∂g/∂λ is identically zero, so it is index 3, not index 1. An index-1 method run on it can return a plausible pendulum that slides off its own constraint."},
        {note:"Paste a dose/response table → \"dose and response are strongly positively correlated (r = 0.99, p < 0.001); response shows a significant increasing trend.\""}
      ] },
    chemical: { title:"Chemical", tagline:"Correctly formatted chemical formulas, offline 2D structures from a name/formula/SMILES, and a full physicochemical + pKa readout.",
      does:[
        "<b>Formatted formulas</b> with correct sub/superscripts — digits become subscripts, charges become superscripts.",
        "<b>2D structures</b>, fully offline, from a common <b>name</b> (359 built-in compounds), a <b>formula</b>, or a <b>SMILES</b> string; isomeric SMILES draw with wedge/hash stereochemistry.",
        "<b>Formula validator</b> — every element checked against the real 118-element periodic table, parentheses/hydrates balanced, with molecular weight and net charge (polyatomic ions handled).",

    spectra: { title:"Spectra", tagline:"Predicted ¹H/¹³C NMR, IR, UV-Vis and EI-MS fragmentation from a name or SMILES — computed on your machine. Estimates from published rules, never passed off as measured spectra.",
      does:[
        "<b>¹H NMR</b> — chemical shift, <b>integration</b> and <b>multiplicity</b> per signal, with resolved <b>J-coupling constants</b> and multiplet names (dd, td…), each with an assignment. Symmetry-aware, so benzene is one 6H singlet rather than six signals. Typical accuracy ±0.2–0.4 ppm.",
        "<b>2D correlation maps</b> — <b>COSY</b> (¹H–¹H) and <b>HSQC</b> (¹H–¹³C). The coupling topology is exact from the bond graph; the J values are typical literature figures, and the caveats say so.",
        "<b>¹³C NMR</b> — Grant–Paul additivity for sp³ carbons and benzene substituent increments for aromatics, with the carbonyl classes properly separated (ketone ≈ 205, aldehyde ≈ 199, acid ≈ 178, ester ≈ 171). Typical ±2–4 ppm.",
        "<b>IR</b> — characteristic group frequencies with published ranges, plus a simulated transmittance trace. Ester ≈ 1740 > ketone ≈ 1715 > amide ≈ 1660, and conjugation drops C=O by ~25 cm⁻¹.",
        "<b>UV-Vis</b> — λmax by the <b>Woodward–Fieser</b> rules with <b>every increment shown</b>, so you can audit the arithmetic rather than trust a number.",
        "<b>MS fragmentation</b> — exact fragment m/z via α-cleavage, benzylic→tropylium, McLafferty and gated neutral losses. Correctly ranks the real base peak for toluene (m/z 91), ethanol (31) and butylamine (30).",
        "Insert a <b>data table</b> or a <b>spectrum chart</b> — δ increases leftward and wavenumber decreases rightward, per convention.",
        "<b>Open a MEASURED spectrum (JCAMP-DX).</b> Everything above is predicted; this is the opposite. Point it at a <code>.jdx</code>, <code>.dx</code> or <code>.jcm</code> file from your instrument and it plots exactly what the file contains, labelled <i>measured</i> on the chart so the two can never be confused. Read on your machine, nothing uploaded. Long traces are reduced for drawing by keeping the <b>minimum and maximum of every bucket</b>, so a one-point peak survives — the obvious shortcut, keeping every n<sup>th</sup> point, drops narrow bands silently and leaves a tidy spectrum with a band missing.",
        "<b>Compare with acquired spectrum</b> — the prediction (¹H, ¹³C, IR, UV-Vis or MS) drawn over a loaded JCAMP-DX file, with a match table of each predicted line, the nearest measured peak and Δ; referencing is never shifted silently (an offset is reported until you give a reference peak, e.g. 86.25 = 77.16 for CDCl₃). The reader decodes DIF/DUP exactly, enforces the file's own checks (a failing block cannot be inserted), reads 1D NMR NTUPLES and offers a block picker. Mass Spec isotope patterns cover all 84 elements with a natural isotopic composition (AME2020 masses, CIAAW 2024 abundances; M−2 with a true minus) and draw as a stick chart; diastereotopic methyls and CH₂ are reported as such; Woodward–Fieser scores every enone arm and refuses quinones and aryl enones by name.",
        "<b>Honest by construction.</b> Structure recognition is exact; the values are empirical estimates and every screen says so. Out-of-domain cases are disclosed rather than guessed: an unconjugated molecule reports <i>transparent</i> instead of a fabricated λmax, fused and heteroaromatic rings say they are approximate, and MS “likelihood” is a rule-based <b>ranking, not an intensity</b>."
      ],

        {in:"toluene, ¹³C NMR", out:"137.8, 129.2, 128.4, 125.6, 20.7 — within ~1 ppm of literature"},

        {in:"an IR file, 30,000 points", out:"drawn at 1,200 points, keeping the min AND max of each bucket — a one-point peak survives"},
        {note:"Everything above this line is PREDICTED from structure; the JCAMP reader is the opposite, and the chart says which you are looking at. The axis follows the technique, not the file: IR, Raman and NMR are drawn with their x quantity increasing leftward, so a mirrored spectrum — which looks perfectly plausible — cannot happen."},
        {note:"An assignment aid — always verify against an acquired spectrum."}

    bioassay: { title:"Bio/Assay", tagline:"Quantitative life-science tools — offline curve fitting with parameters ± SE and R², plus everyday lab math, with the fit drawn over your data.",

    stats: { title:"Stats", tagline:"Turn experimental data into a paper-ready result offline — parametric and non-parametric tests, ANOVA, regression, and uncertainty, all with real p-values.",
      does:[

        "<b>ANOVA</b> — one-way and <b>two-way</b> (balanced, with interaction); <b>linear regression</b> (slope, R², slope p).",
        "<b>Chi-square</b> — goodness-of-fit and test of independence (contingency table).",
        "<b>Multiple-comparison correction</b> — Bonferroni, Holm, and Benjamini–Hochberg (FDR).",
        "<b>Uncertainty propagation</b> — a formula plus <code>a = 10 ± 0.1</code> lines → result with combined 1σ. P-values use real distribution functions (incomplete beta / gamma).",
        "<b>Effect sizes</b> \u2014 every t-test reports Cohen's <i>d</i> and a 95% confidence interval on the difference, which journals require alongside <i>p</i>. The paired test reports <i>d</i><sub>z</sub> and says so, because the two are not comparable.",
        "<b>Assumption checks</b> \u2014 D'Agostino\u2013Pearson K\u00b2 for normality, Brown\u2013Forsythe for equal variances. Warnings name the alternative to use, and below n = 20 it refuses to report rather than returning a number with no power behind it.",
        "<b>Beyond two groups</b> \u2014 Kruskal\u2013Wallis with Dunn post-hoc, Friedman for repeated measures, and <b>Dunnett</b> for every treatment against one control (which corrects for the comparisons you wanted, not all pairs).",
        "<b>Regression</b> \u2014 multiple and polynomial, solved by QR, with <b>residual and normal Q\u2013Q plots</b> under the result: a curved relationship fitted with a line posts a fine R\u00b2 while being wrong at both ends, and only the residual plot shows it.",
        "<b>Cox regression</b> \u2014 hazard ratios with 95% confidence intervals, likelihood-ratio, Wald and score tests, Harrell\u2019s C and the proportional-hazards test; Efron ties (Breslow on request); refused by name when there are too few events per parameter or the likelihood diverges; a forest plot on a log axis and adjusted survival curves. Reads OS_MONTHS / OS_STATUS style tables at the cursor.",
        "<b>Repeated-measures ANOVA</b> \u2014 one within-subject factor or a mixed design, Mauchly\u2019s test (refused by name when undefined), Greenhouse\u2013Geisser and Huynh\u2013Feldt corrections, partial \u03b7\u00b2, Holm post-hoc, and a profile plot; long or wide tables.",

        "<b>Survival analysis</b> \u2014 Kaplan\u2013Meier with Greenwood intervals, log-rank, hazard ratio. Censored subjects stay at risk up to their time and no further; median survival reads NOT REACHED when the curve never falls to 50%.",
        "<b>Significance brackets (v2.143.0)</b> — box plots carry brackets from the t-test, paired t-test, Mann–Whitney, Wilcoxon, Tukey HSD or Dunn result just computed, never from a typed asterisk. Each result is re-checked against itself before it is drawn; brackets follow the α the test was run at, the legend names the test, α and the correction, and <b>Hide ns</b> is an explicit choice whose hidden pairs are counted in the caption. Journal figure styles and A/B/C panels apply here too.",

    build: { title:"Build", tagline:"Draw in a ChemDraw-like editor that corrects as you go — ChemDraw files open structure by structure and save as .cdxml — or build a structure from a typed atom/bond list or a molfile, including Markush/generic genus structures for patents.",
      does:[
        "<b>A ChemDraw-like editor</b> that corrects the drawing as you go: atoms with an element palette or any label (N, Cl, R1, OMe), bonds, rings, chains, charges, wedge/hash stereo; or pop out the <b>large canvas</b>. The readout gives the formula, weight, <b>monoisotopic mass</b>, SMILES and <b>R/S and E/Z</b> by the CIP rules ((2<i>R</i>)-butan-2-ol).",
        "<b>ChemDraw files</b> — <b>Open ChemDraw file…</b> (.cdx, .cdxml) lists the file's structures, each drawn small, to pick from; one opens full size in the editor. A structure that carries more than a molecule — polymer <b>brackets</b>, a counter-ion, a drawn charge, or an η-bond — opens on the <b>page canvas</b>, as drawn, and a polymer gives its formula per repeat unit; <b>Open the whole page as a drawing</b> keeps a page's <b>arrows</b> and <b>captions</b>. <b>Open ChemDraw picture</b> takes one pasted from ChemDraw into the document; <b>Save as .cdxml</b> writes a file ChemDraw opens; <b>Replace selected picture</b> puts the edited drawing where the old one was.",
        "<b>Metallocenes</b> — an <b>η-bond tool</b> (a ring bound to a metal) and templates, their Cp rings drawn in perspective (zirconocene dichloride, ansa-metallocene, half-sandwich, bis(borohydride), polymer-bound). The formula, weight and monoisotopic mass count the atoms however they are bonded (Cp₂ZrCl₂: C₁₀H₁₀Cl₂Zr, 292.32 g/mol); the SMILES is the ionic form databases use, labelled as such.",
        "<b>Properties</b> — radicals, <b>AND / OR stereo groups</b> (drawn &1, or1), query features (substituents, ring bonds, unsaturation; ring or chain bonds; bonds that may be several orders) and <b>atom lists</b> typed as [N,O] or NOT [F,Cl] — each written as ChemDraw's own attribute, and every structure read back to prove it holds exactly what was drawn. What ChemDraw has no form for is refused by name.",
        "<b>Clean structure</b> — tidies each structure (or just the selected ones) in place: its centre kept, captions and arrows untouched, group labels kept as labels, and the structure read again afterwards — stereo included — and refused rather than changed. One undo restores your hand-drawn layout. <b>Reset canvas</b> wipes to a fresh start, also undo-recoverable.",
        "<b>Insert size</b> — ChemDraw size by default (as drawn, reduced only to fit the page; the status says when its letters are under the USPTO minimum), or <b>USPTO drawing sheet size</b>: enlarged until its smallest lettering (subscripts and charges included) meets the 1/8-inch minimum of 37 CFR 1.84(p)(3); one too large for the page at that size is refused, never shrunk below the rule.",
        "<b>Live compliance note</b> — as you draw, an exceeded valence (a five-bonded carbon) or two atoms sitting on top of each other reads <i>Not compliant</i> under the canvas; a deliberately drawn ion's net charge is a note, not a rejection.",
        "Atom/bond list or a pasted MDL molfile; bonds single/double/triple/undefined/stereo, atom charges, auto hydrogens.",
        "<b>Markush / generic</b> atoms — [C,N] lists, X halogen, A any atom, Q heteroatom, R/R1/R2 R-groups.",
        "<b>R-group legends</b> — \"where R1 = …\" as a line or a structured R-group | Definition table; nested (sub-generic) R-groups auto-detected.",
        "<b>Query features</b> for a rigorous genus — {ar} aromatic, {ring} in-ring, {r5}/{r6} ring size, {sub}/{nosub}.",
        "<b>Substituent gallery</b> — depict R-group alternatives as drawn 2D structures."
      ],
      examples:[
        {in:"atoms: C O O / bonds: 1=2 1=3", out:"CO₂ structure"},
        {in:"atoms: [C,N] C C C C C (ring)", out:"a benzene/pyridine genus"}
      ] },

    refs: { title:"Refs", tagline:"Captions, equation numbers and cross-references as Word's own fields — they renumber when a figure is added, moved or deleted — plus a table of figures and a gap/duplicate check.",
      does:[
        "<b>Word fields</b> (the default): a caption is Word's Caption style with a SEQ field — Figure, Table or Scheme — optionally with chapter numbers (Figure 2.3, restarting at each numbered Heading 1). Insert a figure in the middle and <b>Update numbers</b> renumbers every caption and every reference to it (on a Word without that API: select all, F9).",
        "<b>Cross-references</b> list what is numbered, each with its current number, and insert “Fig. 3”, “Table 2” or “Eq. (1)” as a REF field that follows its target (Ctrl+click jumps to it).",
        "<b>Equation numbers</b> (Math ▸ Equation numbers): (1), (2) … or by chapter (2.1) as Word fields, cross-referenceable; (I), (II) … for patent formulas as before.",
        "<b>Table of figures / tables / schemes</b>: Word's own TOC field over those captions. <b>Plain text</b> numbering is still there for documents that use it.",
        "<b>Auto-numbered captions</b> — \"Figure 1.\", \"Table 2.\" with per-document counters saved in the file.",

    citations: { title:"Citations", tagline:"Bluebook legal citations — cases, statutes, patents, agency &amp; secondary sources — plus a Table of Contents, Table of Authorities, and citation register.",
      does:[
        "<b>Cases</b> — full and short form, parallel citations, T6/T10 abbreviation; an unrecognized reporter is flagged.",
        "<b>Statutes &amp; regulations</b> (35 U.S.C. § 101, 37 C.F.R. § 1.84), <b>patents</b> and application publications, <b>agency &amp; secondary</b> (Fed. Reg., MPEP, law-review articles, treatises).",
        "<b>Practitioner / academic</b> typeface toggle; reporter/court auto-correct; signals (See, Cf., …); date normalization.",
        "<b>Paste &amp; fix</b> — paste a messy citation and it detects the type and reformats it; <b>Id./supra</b> short forms.",
        "<b>Table of Contents</b> (FRAP 28(a)(2)) and <b>Table of Authorities</b> — grouped, alphabetized, de-duplicated, case names italic, (court year) parentheticals, with a page-number flow.",
        "<b>Citation register</b> — scan the document for every authority with a usage count.",
        "<b>Short forms in the Table of Authorities</b> \u2014 <i>Alice</i>, 573 U.S. at 217 and <i>Id.</i> are marked too, so the page list is the whole discussion rather than the first page alone. A short reference that cannot be tied to one authority is left unmarked and counted, not guessed.",
        "<b>Table of Authorities and Bluebook fixes (v2.141.0)</b> — page marks go only where the cite is: <code>10 F.3d 5</code> no longer matches inside <code>110 F.3d 512</code>, nor <code>§ 10</code> inside <code>§ 101</code>, and a bare <i>Id.</i> never matches <i>said.</i> or <i>paid.</i> Curly and straight <i>Int’l</i> are one row with both pages; <b>passim</b> is kept; <i>In re</i> short forms are found. <i>eBay</i> and <i>iRobot</i> keep their first letter, <code>35 U.S.C. §§ 102, 103</code> marks both § 102 and § 103, footnotes and endnotes are scanned where Word allows it, <code>US10123456B2</code> → U.S. Patent No. 10,123,456, and Paste &amp; fix reads Federal Register, parallel, column-and-line and Westlaw cites. Word’s search itself is checked in the manual in-Word pass.",
        "<b>Bibliography: reference styles and numbering (v2.142.0)</b> — IEEE, ACS, Nature (journal articles), Vancouver (NLM; the one that formats patents), APA 7, Chicago author-date and Chicago notes-bibliography (into footnotes), each claiming only item types with three or more verbatim examples from its own manual; Harvard and MLA are not offered, as no official guide could be verified. Import BibTeX (accents, <code>$H_2O$</code> → H₂O, <code>{DNA}</code> and <code>{pH}</code> protected, crossref, @string), RIS, CSL-JSON, or a pasted DOI, which is recognised offline and never looked up. <b>Update numbering &amp; bibliography</b> renumbers in document order and rebuilds the list; a second run changes nothing, problems are listed by name, and a citation whose record was deleted shows <code>[?]</code>. Word’s tag-length and settings-size limits are checked in the manual in-Word pass.",
      ],
      examples:[
        {in:"alice corp v cls bank, 573 us 208 (2014)", out:"<em>Alice Corp. v. CLS Bank Int'l</em>, 573 U.S. 208 (2014)"},
        {in:"35 usc 101", out:"35 U.S.C. § 101"}
      ] },
