<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JurisLab — Large drawing canvas</title>
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <!-- The pane's own styles: the controls look and behave exactly as in the pane. -->
    <link rel="stylesheet" href="../taskpane/taskpane.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      /* Controls | the 3D canvas | the sheet and its buttons. */
      #cad-section {
        display: grid;
        grid-template-columns: minmax(240px, 300px) minmax(0, 1fr) minmax(280px, 34%);
        gap: 12px;
        height: 100vh;
        padding: 12px;
        box-sizing: border-box;
      }
      .cad-col {
        min-height: 0;
        overflow: auto;
      }
      .cad-col.canvas-col {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .canvas-col .cad-canvas-wrap {
        flex: 1 1 auto;
        min-height: 0;
        margin: 0 0 6px;
      }
      .canvas-col .cad-canvas {
        height: 100%;
        resize: none;
      }
      /* Drawing on the sheet (Pencil, Line, Arrow, Numeral, Text, Erase, Add detail view): the sheet takes the
         room the 3D view had, so it is drawn on at size; the 3D view comes back when the tool is off. */
      #cad-section.cad-marking {
        grid-template-columns: minmax(240px, 300px) minmax(0, 1fr);
      }
      #cad-section.cad-marking > .cad-col.canvas-col {
        display: none;
      }
      #cad-section.cad-marking #cad-preview svg {
        max-height: calc(100vh - 230px);
      }
      /* A sketch always has its canvas (never both hidden). */
      #cad-section.cad-sketching.cad-marking > .cad-col.canvas-col {
        display: flex;
      }
      /* The status line under the 3D view is hidden while marking: its copy by the sheet shows instead. */
      #cad-status-sheet { display: none; }
      #cad-section.cad-marking #cad-status-sheet { display: block; }
      /* Sketching: the column scrolls, and the sketch gets the room the 3D view had. */
      #cad-section.cad-sketching .cad-col.canvas-col {
        overflow: auto;
      }
      .canvas-col .cad-sketch-canvas {
        height: max(420px, calc(100vh - 330px));
      }
      /* Sketching: the sketch gets the whole window; parts and sheet wait at the sides, hidden. */
      #cad-section.cad-sketching {
        grid-template-columns: minmax(0, 1fr);
      }
      #cad-section.cad-sketching > .cad-col:not(.canvas-col) {
        display: none;
      }
      #cad-error {
        display: none;
        margin: 0 0 8px;
        padding: 8px 10px;
        border: 1px solid #c2410c;
        border-radius: 4px;
        color: #9a3412;
        background: #fff7ed;
      }
      .dlg-btns {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      /* One column on a narrow window: everything still reachable by scrolling. */
      @media (max-width: 760px) {
        html,
        body {
          overflow: auto;
        }
        #cad-section {
          display: block;
          height: auto;
        }
        .canvas-col .cad-canvas {
          height: 60vh;
        }
      }
    </style>
  </head>
  <body>
    <section id="cad-section">
      <div class="cad-col">
        <div id="cad-error" role="alert"></div>
        <label class="field-label" for="cad-standard">Drawing standard</label>
        <select id="cad-standard" class="lib-select"></select>
        <div class="cad-add-row">
          <select id="cad-shape" class="lib-select" aria-label="Shape to add"></select>
          <button id="cad-add" class="insert-btn secondary" type="button">Add part</button>
        </div>
        <button id="cad-new" class="insert-btn secondary" type="button" title="Clear every part and callout for a blank drawing (click twice; Undo afterwards)">New drawing</button>
        <div id="cad-parts" class="cad-parts" aria-label="Parts"></div>
        <div id="cad-editor" class="cad-editor"></div>
        <div id="cad-callouts" class="cad-parts" aria-label="Callouts"></div>
        <fieldset id="cad-views" class="cad-views">
          <legend>Views on the sheet</legend>
          <label><input type="checkbox" value="front" checked /> Front</label>
          <label><input type="checkbox" value="top" checked /> Top</label>
          <label><input type="checkbox" value="right" checked /> Right</label>
          <label><input type="checkbox" value="iso" checked /> Isometric</label>
          <label><input type="checkbox" value="orbit" /> This view</label>
          <label title="A figure with no parts in it: draw on it with the tools above the drawing"><input type="checkbox" value="blank" /> Blank figure</label>
          <label title="The parts drawn apart, with phantom trail lines showing where each one goes"><input type="checkbox" value="exploded" /> Exploded</label>
          <label title="A pictorial view from the isometric direction with the eye at a finite distance: near parts larger, parallel edges meeting"><input type="checkbox" value="perspective" /> Perspective</label>
          <select id="cad-perspective-distance" class="lib-select" aria-label="How strong the perspective view is"></select>
        </fieldset>
        <div class="cad-assembly-views" role="group" aria-label="Exploded, detail and section views">
          <button id="cad-explode-auto" type="button" class="insert-btn secondary" title="Lift the parts apart in levels (the lowest stay put); change any part's distance under the part">Auto explode</button>
          <button id="cad-detail" type="button" class="insert-btn secondary" aria-pressed="false" title="Then click a spot on a figure in the drawing: that part is drawn again, larger, as a detail view">Add detail view</button>
          <select id="cad-detail-factor" class="lib-select" aria-label="How much larger a new detail view is">
            <option value="2">2× larger</option>
            <option value="3">3× larger</option>
            <option value="4">4× larger</option>
            <option value="5">5× larger</option>
            <option value="10">10× larger</option>
          </select>
          <div id="cad-details" class="cad-parts" aria-label="Detail views"></div>
          <button id="cad-cut" type="button" class="insert-btn secondary" aria-pressed="false" title="Then click two points on a front, top or side figure in the drawing: the part is cut along that line and drawn as a section view, hatched">Add section view</button>
          <div id="cad-cuts" class="cad-parts" aria-label="Section views"></div>
        </div>
        <label class="field-label" for="cad-hidden">Hidden lines</label>
        <select id="cad-hidden" class="lib-select">
          <option value="">As the standard says</option>
          <option value="show">Show (dashed)</option>
          <option value="hide">Hide</option>
        </select>
        <div id="cad-sheet-block" class="cad-sheet-block">
          <label class="field-label" for="cad-sheet">Sheet</label>
          <select id="cad-sheet" class="lib-select"></select>
          <select id="cad-orient" class="lib-select" aria-label="Sheet orientation" hidden></select>
          <details id="cad-titleblock-wrap" class="cad-details" hidden>
            <summary>Title block</summary>
            <div id="cad-titleblock" class="cad-titleblock"></div>
          </details>
          <fieldset id="cad-layers" class="cad-views">
            <legend>Layers</legend>
          </fieldset>
          <details class="cad-details">
            <summary>Line types</summary>
            <div id="cad-linetypes" class="cad-linetypes"></div>
          </details>
        </div>
      </div>
      <div class="cad-col canvas-col">
        <div class="cad-canvas-wrap">
          <canvas id="cad-canvas" class="cad-canvas" aria-label="3D view: drag to turn, wheel to zoom, click a part to edit it"></canvas>
        </div>
        <div id="cad-sketch" class="cad-sketch" hidden tabindex="-1" aria-label="Sketch editor">
          <div class="cad-sketch-ribbon" role="toolbar" aria-label="Sketch tools">
            <div class="sk-group" aria-label="Draw">
              <span class="sk-group-name">Draw</span>
              <button type="button" class="insert-btn secondary" data-sk-tool="select" title="Select (S): click to select, drag a point to move it">Select</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="line" title="Line (L): click, click — the chain continues; type the length and angle; right-click or Esc ends it">Line</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="rectangle" title="Rectangle (R): two opposite corners — or type W and H, then click">Rectangle</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="centreRectangle" title="Rectangle from its centre, then a corner — or type W and H">Centre rect</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="circle" title="Circle (C): centre, then a point on it — or type the diameter">Circle</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="arc" title="Arc (A): centre, start, then the end (counter-clockwise)">Arc</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="arc3" title="Arc through three points: start, end, a point on it">3-pt arc</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="polygon" title="Regular polygon: centre, then a corner (sides in the box)">Polygon</button>
              <label class="cad-sketch-check" title="Polygon sides">Sides <input id="cad-sketch-sides" class="rgroup-input" type="number" min="3" max="64" step="1" value="6" style="width:4em" /></label>
              <button type="button" class="insert-btn secondary" data-sk-tool="slot" title="Slot: one end centre, the other, then the width">Slot</button>
              <button type="button" class="insert-btn secondary" data-sk-tool="point" title="Point (P)">Point</button>
              <label class="cad-sketch-check" title="New geometry is construction (thin, dashed; not part of the solid)"><input type="checkbox" id="cad-sketch-construction" /> Construction</label>
            </div>
            <div class="sk-group" aria-label="Dimension">
              <span class="sk-group-name">Dimension</span>
              <button type="button" class="insert-btn secondary" data-sk-tool="dimension" title="Smart Dimension (D): click a line, circle or arc (or two lines for an angle), type the value, Enter">Smart Dimension</button>
            </div>
            <div class="sk-group" role="toolbar" aria-label="Modify the selection">
              <span class="sk-group-name">Modify</span>
              <button type="button" class="insert-btn secondary" data-sk-tool="trim" title="Trim (T): click the piece of a line to cut away (back to where it meets other lines)">Trim</button>
              <button id="cad-sketch-fillet" type="button" class="insert-btn secondary" title="Round the corner of two selected lines (radius in the value box)">Fillet</button>
              <button id="cad-sketch-chamfer" type="button" class="insert-btn secondary" title="Cut the corner of two selected lines (distance in the value box)">Chamfer</button>
              <button id="cad-sketch-offset" type="button" class="insert-btn secondary" title="Offset the selection (distance in the value box; negative = the other way / inward)">Offset</button>
              <button id="cad-sketch-mirror" type="button" class="insert-btn secondary" title="Mirror the selection about the line selected last">Mirror</button>
              <label class="cad-sketch-check" title="How many in a pattern">Count <input id="cad-sketch-count" class="rgroup-input" type="number" min="2" max="100" step="1" value="3" style="width:4em" /></label>
              <button id="cad-sketch-pattern" type="button" class="insert-btn secondary" title="Copy the selection in a row: spacing in the value box (dx, or dx dy)">Pattern</button>
              <button id="cad-sketch-circular" type="button" class="insert-btn secondary" title="Copy the selection round a selected point (total angle in the value box; empty = 360°)">Circular</button>
              <button id="cad-sketch-clear" type="button" class="insert-btn secondary" title="Empty the sketch (Undo brings it back)">Clear sketch</button>
            </div>
            <div class="sk-group" aria-label="View">
              <span class="sk-group-name">View</span>
              <button id="cad-sketch-fit" type="button" class="insert-btn secondary" title="Fit (F): the whole sketch in view">Fit</button>
              <label class="cad-sketch-check" title="Snap to the grid (G); points and alignments still win"><input type="checkbox" id="cad-sketch-grid" checked /> Grid snap</label>
              <span id="cad-sketch-gridlabel" class="sk-grid-label"></span>
            </div>
          </div>
          <div class="cad-sketch-inputbar">
            <span id="cad-sketch-prompt" class="sk-prompt" role="status"></span>
            <label id="cad-sketch-in1-label" class="cad-sketch-check" hidden><span id="cad-sketch-in1-name">W</span> <input id="cad-sketch-in1" class="rgroup-input sk-size" type="text" inputmode="decimal" autocomplete="off" /></label>
            <label id="cad-sketch-in2-label" class="cad-sketch-check" hidden><span id="cad-sketch-in2-name">H</span> <input id="cad-sketch-in2" class="rgroup-input sk-size" type="text" inputmode="decimal" autocomplete="off" /></label>
          </div>
          <canvas id="cad-sketch-canvas" class="cad-sketch-canvas" aria-label="Sketch: click with a tool; wheel zooms; middle-drag or Space + drag pans"></canvas>
          <p id="cad-sketch-status" class="build-readout" role="status"></p>
          <div class="cad-sketch-row">
            <input id="cad-sketch-dim" class="rgroup-input" type="text" placeholder="20, Ø20, R5, 45°" aria-label="Dimension value" />
            <button id="cad-sketch-dimension" type="button" class="insert-btn secondary" title="Dimension the selection (or change the selected dimension)">Dimension</button>
            <label class="cad-sketch-check" title="Shown, but not solved for (a reference dimension)"><input type="checkbox" id="cad-sketch-driven" /> Driven</label>
            <button id="cad-sketch-delete" type="button" class="insert-btn secondary" title="Delete (Del)">Delete</button>
            <button id="cad-sketch-undo" type="button" class="insert-btn secondary" title="Undo (Ctrl+Z)">Undo</button>
          </div>
          <details class="cad-details sk-relations">
            <summary>Relations</summary>
            <div class="cad-sketch-rels" role="toolbar" aria-label="Relations for the selection">
              <button type="button" class="insert-btn secondary" data-sk-rel="horizontal" title="Horizontal (a line)">H</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="vertical" title="Vertical (a line)">V</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="parallel" title="Parallel (two lines)">∥</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="perpendicular" title="Perpendicular (two lines)">⊥</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="tangent" title="Tangent (a line and a circle / arc, or two circles / arcs)">Tangent</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="equal" title="Equal (two lines, or two circles / arcs)">=</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="concentric" title="Concentric (two circles / arcs)">◎</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="coincident" title="Connect (two points)">Connect</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="onCurve" title="A point on a line, circle or arc">On</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="midpoint" title="A point at the middle of a line">Mid</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="symmetric" title="Two points symmetric about a line (select the line last)">Sym</button>
              <button type="button" class="insert-btn secondary" data-sk-rel="fix" title="Fix a point where it is (Rigid)">Fix</button>
            </div>
          </details>
        <div id="cad-sketch-msg" class="build-readout" aria-live="polite"></div>
          <div class="cad-sketch-row sk-finish">
            <select id="cad-sketch-op" class="lib-select" aria-label="Make the solid by">
              <option value="extrude">Extrude</option>
              <option value="revolve">Revolve about the selected line</option>
            </select>
            <label class="cad-field"><span>Depth</span><input id="cad-sketch-depth" class="rgroup-input" type="text" value="10" /></label>
          </div>
          <div class="cad-sketch-row sk-finish">
            <button id="cad-sketch-done" type="button" class="insert-btn">Done</button>
            <button id="cad-sketch-cancel" type="button" class="insert-btn secondary">Cancel</button>
          </div>
        </div>
        <div class="cad-view-btns">
          <button type="button" class="insert-btn secondary" data-cad-view="front">Front</button>
          <button type="button" class="insert-btn secondary" data-cad-view="top">Top</button>
          <button type="button" class="insert-btn secondary" data-cad-view="right">Right</button>
          <button type="button" class="insert-btn secondary" data-cad-view="iso">Isometric</button>
          <button id="cad-callout" type="button" class="insert-btn secondary" aria-pressed="false">Add callout</button>
          <button id="cad-mate" type="button" class="insert-btn secondary" aria-pressed="false" title="Click a flat face of the part to move, then the face it goes against: flush, corners and centres snap together">Mate faces</button>
          <button id="cad-mate-undo" type="button" class="insert-btn secondary" disabled>Undo mate</button>
        </div>
        <p id="cad-status" class="build-readout" role="status"></p>
      </div>
      <div class="cad-col">
        <div id="cad-msg" class="build-readout" aria-live="polite"></div>
        <p id="cad-status-sheet" class="build-readout" role="status"></p>
        <div id="cad-mark-bar" class="cad-mark-bar" role="toolbar" aria-label="Draw on the drawing">
          <span class="preview-label">Draw on the drawing</span>
          <button type="button" class="insert-btn secondary" data-mark-tool="pen" aria-pressed="false" title="Pencil: drag on a figure to draw, exactly as you move">Pencil</button>
          <button type="button" class="insert-btn secondary" data-mark-tool="line" aria-pressed="false" title="Line: drag from one end to the other">Line</button>
          <button type="button" class="insert-btn secondary" data-mark-tool="arrow" aria-pressed="false" title="Arrow: drag from the tail to the point it shows">Arrow</button>
          <button type="button" class="insert-btn secondary" data-mark-tool="numeral" aria-pressed="false" title="Numeral: drag from the point it names to where the number goes (a click puts it beside the point)">Numeral</button>
          <button type="button" class="insert-btn secondary" data-mark-tool="text" aria-pressed="false" title="Text: type it in the box, then click where it goes">Text</button>
          <button type="button" class="insert-btn secondary" data-mark-tool="erase" aria-pressed="false" title="Erase: click a mark you drew">Erase</button>
          <button id="cad-mark-undo" type="button" class="insert-btn secondary" disabled title="Take back the last mark drawn or erased">Undo mark</button>
          <input id="cad-mark-text" type="text" class="formula-input" maxlength="200" placeholder="Text to place, then click on the drawing" aria-label="Text to place" hidden>
        </div>
        <div class="preview-wrap">
          <span class="preview-label">Drawing</span>
          <div id="cad-preview" class="preview" aria-live="polite"></div>
        </div>
        <div class="dlg-btns">
          <button id="cad-insert" class="insert-btn" type="button" disabled>Insert drawing</button>
          <button id="cad-use" class="insert-btn secondary" type="button">Use this drawing</button>
          <button id="cad-cancel" class="insert-btn secondary" type="button">Cancel</button>
          <!-- Re-opening a drawing reads the document, which a dialog cannot: hidden here. -->
          <button id="cad-open" class="insert-btn secondary" type="button" hidden>Edit drawing at cursor</button>
        </div>
      </div>
    </section>
  </body>
</html>
